        function getHolidayInfo(dateStr) {
            if (CN_HOLIDAYS_2026[dateStr]) return { type: 'holiday', label: CN_HOLIDAYS_2026[dateStr] };
            if (CN_WORKDAYS_2026[dateStr]) return { type: 'workday', label: CN_WORKDAYS_2026[dateStr] };
            return null;
        }

        async function renderCalendar() {
            const year = state.calendarYear;
            const month = state.calendarMonth;
            const firstDay = new Date(year, month - 1, 1);
            const lastDay = new Date(year, month, 0);
            const startDay = (firstDay.getDay() + 6) % 7; // Monday-first: 0=Mon
            const daysInMonth = lastDay.getDate();
            const daysInPrevMonth = new Date(year, month - 1, 0).getDate();

            document.getElementById('calendarTitle').textContent = `${year}年 ${month}月`;

            const [schedules, workouts, tasks, anniversaries] = await Promise.all([
                api(`/api/schedules?year=${year}&month=${month}`),
                api(`/api/workouts?year=${year}&month=${month}`),
                api(`/api/tasks?year=${year}&month=${month}`),
                api('/api/anniversaries'),
            ]);

            // Anniversary countdown banner (next upcoming anniversaries)
            renderAnnivCountdown(anniversaries);

            let html = '';
            const weekDays = ['一', '二', '三', '四', '五', '六', '日'];
            weekDays.forEach(d => {
                html += `<div class="day-header">${d}</div>`;
            });

            const today = new Date();

            // Previous month days (clickable -> jump to that month)
            const prevMonthDate = new Date(year, month - 2, 1);  // 0-based month of prev month
            const prevYear = prevMonthDate.getFullYear();
            const prevMonthNum = prevMonthDate.getMonth() + 1;
            for (let i = startDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                const dateStr = `${prevYear}-${String(prevMonthNum).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                html += `<div class="day-cell other-month" onclick="jumpToDate('${dateStr}')"><div class="day-num">${day}</div></div>`;
            }

            // Current month days
            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = today.getFullYear() === year && today.getMonth() + 1 === month && today.getDate() === d;
                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const daySchedules = schedules.filter(s => s.date === dateStr);
                const dayWorkout = workouts.find(w => w.date === dateStr);
                const dayTasks = tasks.filter(t => t.due_date === dateStr);
                const holiday = getHolidayInfo(dateStr);

                // Anniversary on this date (match month/day for yearly ones)
                const dayAnnivs = anniversaries.filter(a => {
                    const ad = new Date(a.anniv_date);
                    return a.yearly
                        ? (ad.getMonth() + 1 === month && ad.getDate() === d)
                        : a.anniv_date === dateStr;
                });

                // Holiday / make-up workday tag next to day number
                let holidayTag = '';
                if (holiday) {
                    const cls = holiday.type === 'holiday' ? 'holiday-tag' : 'workday-tag';
                    holidayTag = `<span class="${cls}">${holiday.label}</span>`;
                }
                // Anniversary tag
                let annivTag = '';
                if (dayAnnivs.length > 0) {
                    annivTag = `<span class="anniv-tag">🎂 ${dayAnnivs.map(a => esc(a.name)).join('·')}</span>`;
                }

                // Build cell items: workouts first, then tasks, then schedules
                const items = [];
                if (dayWorkout) {
                    const wlabel = dayWorkout.workout_type === 'strength' ? '💪 力量' : dayWorkout.workout_type === 'cardio' ? '🏃 有氧' : '🔀 混合';
                    items.push(`<div class="cell-item workout-item">${wlabel}</div>`);
                }
                dayTasks.forEach(t => {
                    items.push(`<div class="cell-item todo-${t.category}${t.completed ? ' done' : ''}">${esc(t.title)}</div>`);
                });
                daySchedules.forEach(s => {
                    items.push(`<div class="cell-item schedule-item" style="--sc:${s.color}">${esc(s.title)}${s.time ? ' ' + esc(s.time) : ''}</div>`);
                });

                // Show up to 4 items in the cell, rest as "+N 更多"
                const MAX = 4;
                const visible = items.slice(0, MAX);
                const extra = items.length - MAX;
                const itemsHtml = visible.length
                    ? `<div class="cell-items">${visible.join('')}${extra > 0 ? `<div class="more-items">+${extra} 更多</div>` : ''}</div>`
                    : '';

                html += `<div class="day-cell ${isToday ? 'today' : ''} ${holiday ? 'has-holiday' : ''}" onclick="openDayDetail('${dateStr}')">
                    <div class="day-num">${d}${holidayTag}${annivTag}</div>
                    ${itemsHtml}
                </div>`;
            }

            // Next month days (clickable -> jump to that month)
            const nextMonthDate = new Date(year, month, 1);  // 0-based month of next month
            const nextYear = nextMonthDate.getFullYear();
            const nextMonthNum = nextMonthDate.getMonth() + 1;
            const totalCells = startDay + daysInMonth;
            const remaining = (7 - (totalCells % 7)) % 7;
            for (let d = 1; d <= remaining; d++) {
                const dateStr = `${nextYear}-${String(nextMonthNum).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                html += `<div class="day-cell other-month" onclick="jumpToDate('${dateStr}')"><div class="day-num">${d}</div></div>`;
            }

            document.getElementById('calendarGrid').innerHTML = html;
            renderScheduleList(schedules);
            renderNoDateTasks(tasks);
        }

        // ===== Anniversary helpers =====
        function nextAnnivDate(anniv, fromDate) {
            // For yearly: next occurrence from today (this year or next year)
            const ad = new Date(anniv.anniv_date);
            if (!anniv.yearly) return new Date(anniv.anniv_date);
            const cand = new Date(fromDate.getFullYear(), ad.getMonth(), ad.getDate());
            if (cand < new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate())) {
                cand.setFullYear(fromDate.getFullYear() + 1);
            }
            return cand;
        }

        async function renderAnnivCountdown(anniversaries) {
            const el = document.getElementById('annivCountdown');
            if (!el) return;
            if (!anniversaries || anniversaries.length === 0) {
                el.innerHTML = `<div class="anniv-card anniv-empty" onclick="openAnniversaryModal()">
                    <div class="ac-name">🎂 添加纪念日</div>
                    <div class="ac-date">生日、纪念日不忘记</div>
                </div>`;
                return;
            }
            const today = new Date();
            // Sort by days until next occurrence
            const upcoming = anniversaries
                .map(a => {
                    const next = nextAnnivDate(a, today);
                    const days = Math.round((next - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
                    return { ...a, next, days };
                })
                .sort((a, b) => a.days - b.days)
                .slice(0, 5);
            el.innerHTML = upcoming.map(a => {
                const daysLabel = a.days === 0 ? '就是今天！' :
                    a.days === 1 ? '明天' : `还有 ${a.days} 天`;
                return `
                <div class="anniv-card ${a.days === 0 ? 'days0' : ''}" onclick="openAnniversaryModal()">
                    <div class="ac-name">🎂 ${esc(a.name)}</div>
                    <div class="ac-date">${a.next.getMonth() + 1}月${a.next.getDate()}日 ${a.yearly ? '· 每年' : ''}</div>
                    <div class="ac-days">${daysLabel}${a.days !== 0 && a.days !== 1 ? '<small> 后</small>' : ''}</div>
                </div>`;
            }).join('');
        }

        function jumpToDate(dateStr) {
            const parts = dateStr.split('-');
            state.calendarYear = parseInt(parts[0]);

        }

        function changeMonth(delta) {
            if (delta === 0) {
                state.calendarYear = new Date().getFullYear();
                state.calendarMonth = new Date().getMonth() + 1;
            } else {
                state.calendarMonth += delta;
                if (state.calendarMonth > 12) { state.calendarMonth = 1; state.calendarYear++; }
                if (state.calendarMonth < 1) { state.calendarMonth = 12; state.calendarYear--; }
            }
            renderCalendar();
        }

        async function renderDiaryCalendar() {
            const { year, month } = diaryState;
            const firstDay = new Date(year, month - 1, 1);
            const lastDay = new Date(year, month, 0);
            const startDay = (firstDay.getDay() + 6) % 7; // Monday-first: 0=Mon
            const daysInMonth = lastDay.getDate();
            const daysInPrevMonth = new Date(year, month - 1, 0).getDate();

            document.getElementById('diaryCalTitle').textContent = `${year}年 ${month}月`;
            const diaries = await api(`/api/diaries?year=${year}&month=${month}`);
            diaryState.monthDiaries = diaries;

            let html = '';
            const weekDays = ['一', '二', '三', '四', '五', '六', '日'];
            weekDays.forEach(d => { html += `<div class="day-header">${d}</div>`; });

            const today = new Date();
            for (let i = startDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                html += `<div class="day-cell other-month"><div class="day-num">${day}</div></div>`;
            }
            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = today.getFullYear() === year && today.getMonth() + 1 === month && today.getDate() === d;
                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayDiary = diaries.find(di => di.date === dateStr);
                const hasDiary = !!dayDiary;
                const hasImages = dayDiary && dayDiary.images && dayDiary.images.length > 0;
                const isSelected = dateStr === diaryState.selectedDate;

                // Mood emoji + content preview inside cell
                let diaryInfoHtml = '';
                if (hasDiary) {
                    const moods = { 1: '😞', 2: '😐', 3: '🙂', 4: '😀', 5: '😊' };
                    const moodHtml = dayDiary.mood ? `<span class="diary-mood">${moods[dayDiary.mood] || ''}</span>` : '';
                    const preview = (dayDiary.content || '').replace(/\n+/g, ' ').slice(0, 50);
                    diaryInfoHtml = `<div style="margin-top:2px;">${moodHtml}${preview ? `<div class="diary-preview">${esc(preview)}</div>` : ''}</div>`;
                }

                // Build photo thumbnails (max 3 shown, tiny thumbs to save memory)
                let photosHtml = '';
                if (hasImages) {
                    const imgs = dayDiary.images.slice(0, 3);
                    const extra = dayDiary.images.length - 3;
                    photosHtml = `<div class="diary-cell-photos">
                        ${imgs.map(it => {
                            const url = (typeof it === 'object' && it) ? (it.url || '') : it;
                            const thumb = (typeof it === 'object' && it) ? (it.thumb || url) : null;
                            const src = thumb || url;
                            return `<img src="${LocalDB.resolveImgSync(src)}" loading="lazy" onclick="event.stopPropagation();viewImage('${url}')" alt="日记照片">`;
                        }).join('')}
                        ${extra > 0 ? `<span class="photo-more">📷+${extra}</span>` : ''}
                    </div>`;
                }

                html += `<div class="day-cell ${isToday ? 'today' : ''} ${hasDiary ? 'has-diary' : ''} ${isSelected ? 'selected' : ''}"
                    style="${isSelected ? 'outline:2px solid var(--primary);' : ''}"
                    onclick="selectDiaryDate('${dateStr}')">
                    <div class="day-num">${d}</div>
                    ${diaryInfoHtml}
                    ${photosHtml}
                    ${hasDiary && !hasImages && !dayDiary.mood && !(dayDiary.content || '').trim() ? '<div class="diary-mark">📖</div>' : ''}
                </div>`;
            }
            const totalCells = startDay + daysInMonth;
            const remaining = (7 - (totalCells % 7)) % 7;
            for (let d = 1; d <= remaining; d++) {
                html += `<div class="day-cell other-month"><div class="day-num">${d}</div></div>`;
            }
            document.getElementById('diaryCalGrid').innerHTML = html;
        }

                if (diaryState.month > 12) { diaryState.month = 1; diaryState.year++; }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                // If it's already small (or not an image we can decode), upload as-is
                if (file.size < 300 * 1024) { resolve(file); return; }
                // Timeout guard: if compression hangs (old phones), upload original
                const timer = setTimeout(() => resolve(file), 8000);
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        try {
                            // Max dimension 1600px keeps quality good but file small
                            const MAX = 1600;
                            let { width, height } = img;
                            if (width > MAX || height > MAX) {
                                const ratio = Math.min(MAX / width, MAX / height);
                                width = Math.round(width * ratio);
                                height = Math.round(height * ratio);
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            clearTimeout(timer);
                            if (typeof canvas.toBlob === 'function') {
                                canvas.toBlob((blob) => {
                                    if (blob) resolve(blob);
                                    else resolve(file); // fallback: upload original
                                }, 'image/jpeg', 0.82);
                            } else {
                                // Old browsers (OPPO ColorOS etc.) may lack toBlob
                                const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
                                const bin = atob(dataUrl.split(',')[1]);
                                const arr = new Uint8Array(bin.length);
                                for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
                                resolve(new Blob([arr], { type: 'image/jpeg' }));
                            }
                        } catch (err) {
                            clearTimeout(timer);
                            resolve(file); // compression failed, upload original
                        }
                    };
                    img.onerror = () => { clearTimeout(timer); resolve(file); }; // fallback: upload original
                    img.src = e.target.result;
                };
                reader.onerror = () => { clearTimeout(timer); resolve(file); };
                reader.readAsDataURL(file);
            });
        }

        function renderMarkdown(text) {
            if (!text) return '<span style="color:var(--text-muted);">（空白笔记）</span>';
            try {
                if (window.marked) {
                    let html = marked.parse(esc(text));
                    // 净化链接：仅允许 http/https/mailto/tel，防 javascript: XSS
                    html = html.replace(/<a\s+href=["']([^"']*)["']/gi, (match, href) => {
                        const h = (href || '').trim().toLowerCase();
                        if (h.startsWith('http://') || h.startsWith('https://') || h.startsWith('mailto:') || h.startsWith('tel:') || h.startsWith('#')) {
                            return match;
                        }
                        return '<a href="#" onclick="return false;"';
                    });
                    return html;
                }
            } catch (e) { /* fallback */ }
            return esc(text).replace(/\n/g, '<br>');
        }

            const labels = metrics.map(m => m.date.slice(5));
            const weightData = metrics.map(m => m.weight);
            const bodyFatData = metrics.map(m => m.body_fat);
            const waistData = metrics.map(m => m.waist);

            weightChartInstance = new Chart(canvas, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        {
                            label: '体重 (kg)',
                            data: weightData,
                            borderColor: '#5b6af0',
                            backgroundColor: 'rgba(91,106,240,0.1)',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 3,
                        },
                        ...(bodyFatData.some(v => v !== null) ? [{
                            label: '体脂率 (%)',
                            data: bodyFatData,
                            borderColor: '#ec4899',
                            backgroundColor: 'rgba(236,72,153,0.1)',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 3,
                            yAxisID: 'y1',
                        }] : []),
                        ...(waistData.some(v => v !== null) ? [{
                            label: '腰围 (cm)',
                            data: waistData,
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245,158,11,0.1)',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 3,
                            borderDash: [5, 5],
                        }] : []),
                    ],
                },
                options: {
                    responsive: true,
                    interaction: { intersect: false, mode: 'index' },
                    plugins: {
                        legend: { position: 'top', labels: { font: { size: 12 } } },
                    },
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: { display: true, text: 'kg / cm' },
                        },
                        ...(bodyFatData.some(v => v !== null) ? {
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                grid: { drawOnChartArea: false },
                                title: { display: true, text: '%' },
                            },
                        } : {}),
                    },
                },
            });

            renderMetricHistory(metrics);
        }

        function renderMetricHistory(metrics) {
            const container = document.getElementById('metricHistory');
            if (!metrics || metrics.length === 0) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = metrics.slice(0, 10).map(m => `
                <div class="task-item" style="margin-bottom:4px;">
                    <div class="task-body">
                        <div class="task-title">📅 ${m.date}</div>
                        <div class="task-meta">
                            ${m.weight !== null ? `⚖️ ${m.weight}kg` : ''}
                            ${m.body_fat !== null ? ` 体脂 ${m.body_fat}%` : ''}
                            ${m.bmi !== null ? ` BMI ${m.bmi}` : ''}
                            ${m.waist !== null ? ` 腰围 ${m.waist}cm` : ''}
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-sm btn-danger" onclick="deleteMetric(${m.id})">🗑</button>
                    </div>
                </div>
            `).join('');
        }

        function openMetricModal() {
            const today = new Date().toISOString().split('T')[0];
            const overlay = document.getElementById('modalOverlay');
            overlay.innerHTML = `
            <div class="modal" style="width:520px;">
                <h3>📈 记录体质数据</h3>
                <div class="form-group">
                    <label>日期</label>
                    <input id="mDate" type="date" value="${today}">
                </div>
                <div class="metric-form-inline">
                    <div class="form-group"><label>体重 (kg)</label><input id="mWeight" type="number" step="0.1" placeholder="如 65.0"></div>
                    <div class="form-group"><label>体脂率 (%)</label><input id="mBodyFat" type="number" step="0.1" placeholder="如 20.5"></div>
                    <div class="form-group"><label>腰围 (cm)</label><input id="mWaist" type="number" step="0.1" placeholder="如 75"></div>
                    <div class="form-group"><label>胸围 (cm)</label><input id="mChest" type="number" step="0.1"></div>
                    <div class="form-group"><label>臀围 (cm)</label><input id="mHip" type="number" step="0.1"></div>
                    <div class="form-group"><label>上臂围 (cm)</label><input id="mArm" type="number" step="0.1"></div>
                    <div class="form-group"><label>大腿围 (cm)</label><input id="mThigh" type="number" step="0.1"></div>
                </div>
                <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:10px;">💡 体重建议每天记录，其他指标每月记录一次即可</div>
                <div class="modal-actions">
                    <button class="btn btn-outline" onclick="closeModal()">取消</button>
                    <button class="btn btn-primary" onclick="saveMetric()">保存</button>
                </div>
            </div>`;
            overlay.classList.add('open');
        }

        async function saveMetric() {
            const data = {
                date: document.getElementById('mDate').value,
                weight: parseFloat(document.getElementById('mWeight').value) || null,
                body_fat: parseFloat(document.getElementById('mBodyFat').value) || null,
                waist: parseFloat(document.getElementById('mWaist').value) || null,
                chest: parseFloat(document.getElementById('mChest').value) || null,
                hip: parseFloat(document.getElementById('mHip').value) || null,
                arm: parseFloat(document.getElementById('mArm').value) || null,
                thigh: parseFloat(document.getElementById('mThigh').value) || null,
            };
            if (!data.date) return alert('请选择日期');
            if (!data.weight && !data.body_fat && !data.waist) return alert('请至少输入一项数据');
            await api('/api/body-metrics', { method: 'POST', body: JSON.stringify(data) });
            closeModal();
            renderMetricsChart();
            loadDashboard();
        }

        async function deleteMetric(id) {
            confirmDialog('确定删除这条记录吗？', async () => {
                await api(`/api/body-metrics/${id}`, { method: 'DELETE' });
                renderMetricsChart();
                loadDashboard();
            });
        }

        // ----- Goals -----
        async function renderGoals() {
            const goals = await api('/api/fitness-goals');
            const list = document.getElementById('goalList');
            if (goals.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="icon">🎯</div><p>还没有设置目标，来定一个吧！</p></div>';
                return;
            }
            list.innerHTML = goals.map(g => {
                const pct = g.start_value != null && g.target_value != null && g.target_value !== g.start_value
                    ? Math.min(100, Math.max(0, ((g.current_value - g.start_value) / (g.target_value - g.start_value)) * 100))
                    : g.current_value != null && g.target_value != null
                        ? Math.min(100, (g.current_value / g.target_value) * 100)
                        : 0;
                return `
                <div class="goal-card ${g.achieved ? 'achieved' : ''}">
                    <div class="goal-actions">
                        <button class="btn btn-sm btn-outline" onclick="openGoalModal(${g.id})">✏️</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteGoal(${g.id})">🗑</button>
                    </div>
                    <div class="goal-title">${esc(g.title)} ${g.achieved ? '✅' : ''}</div>
                    <div class="goal-progress">
                        <div class="progress-bar">
                            <div class="fill ${g.achieved ? 'done' : ''}" style="width:${Math.min(100, pct)}%"></div>
                        </div>
                        <div class="goal-meta">
                            ${g.start_value != null ? `起始: ${g.start_value}${g.unit} → ` : ''}
                            当前: ${g.current_value || '--'}${g.unit}
                            ${g.target_value != null ? ` / 目标: ${g.target_value}${g.unit}` : ''}
                            ${g.target_date ? ` · 期限: ${g.target_date}` : ''}
                            ${g.notes ? ` · ${esc(g.notes)}` : ''}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function openGoalModal(goalId) {
            const isEdit = !!goalId;
            if (isEdit) return api(`/api/fitness-goals/${goalId}`).then(g => _openGoalForm(g));
            _openGoalForm(null);
        }

        function _openGoalForm(goal) {
            const overlay = document.getElementById('modalOverlay');
            const isEdit = !!goal;
            overlay.innerHTML = `
            <div class="modal">
                <h3>${isEdit ? '编辑目标' : '🎯 设置新目标'}</h3>
                <div class="form-group">
                    <label>目标名称 *</label>
                    <input id="gTitle" value="${isEdit ? esc(goal.title) : ''}" placeholder="如：减到60kg、体脂降到18%">
                </div>
                <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
                    <div>
                        <label>起始值</label>
                        <input id="gStart" type="number" step="0.1" value="${isEdit && goal.start_value != null ? goal.start_value : ''}">
                    </div>
                    <div>
                        <label>当前值</label>
                        <input id="gCurrent" type="number" step="0.1" value="${isEdit && goal.current_value != null ? goal.current_value : ''}">
                    </div>
                    <div>
                        <label>目标值</label>
                        <input id="gTarget" type="number" step="0.1" value="${isEdit && goal.target_value != null ? goal.target_value : ''}">
                    </div>
                </div>
                <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
                    <div>
                        <label>单位</label>
                        <select id="gUnit">
                            <option value="kg" ${isEdit && goal.unit === 'kg' ? 'selected' : ''}>kg</option>
                            <option value="%" ${isEdit && goal.unit === '%' ? 'selected' : ''}>%</option>
                            <option value="cm" ${isEdit && goal.unit === 'cm' ? 'selected' : ''}>cm</option>
                            <option value="次" ${isEdit && goal.unit === '次' ? 'selected' : ''}>次/周</option>
                            <option value="" ${isEdit && !goal.unit ? 'selected' : ''}>无</option>
                        </select>
                    </div>
                    <div>
                        <label>开始日期</label>
                        <input id="gStartDate" type="date" value="${isEdit && goal.start_date ? goal.start_date : ''}">
                    </div>
                    <div>
                        <label>目标日期</label>
                        <input id="gTargetDate" type="date" value="${isEdit && goal.target_date ? goal.target_date : ''}">
                    </div>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <input id="gNotes" value="${isEdit ? esc(goal.notes) : ''}" placeholder="可选备注">
                </div>
                <div class="form-group" style="display:flex;align-items:center;gap:8px;">
                    <input type="checkbox" id="gAchieved" ${isEdit && goal.achieved ? 'checked' : ''} style="width:auto;">
                    <label for="gAchieved" style="margin:0;">已达成 ✅</label>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-outline" onclick="closeModal()">取消</button>
                    <button class="btn btn-primary" onclick="${isEdit ? `saveGoal(${goal.id})` : 'saveGoal()'}">保存</button>
                </div>
            </div>`;
            overlay.classList.add('open');
        }

        async function saveGoal(id) {
            const data = {
                title: document.getElementById('gTitle').value.trim(),
                start_value: parseFloat(document.getElementById('gStart').value) || null,
                current_value: parseFloat(document.getElementById('gCurrent').value) || null,
                target_value: parseFloat(document.getElementById('gTarget').value) || null,
                unit: document.getElementById('gUnit').value,
                start_date: document.getElementById('gStartDate').value || null,
                target_date: document.getElementById('gTargetDate').value || null,
                notes: document.getElementById('gNotes').value,
                achieved: document.getElementById('gAchieved').checked,
            };
            if (!data.title) return alert('请输入目标名称');
            if (id) {
                await api(`/api/fitness-goals/${id}`, { method: 'PUT', body: JSON.stringify(data) });
            } else {
                await api('/api/fitness-goals', { method: 'POST', body: JSON.stringify(data) });
            }
            closeModal();
            renderGoals();
            loadDashboard();
        }

        async function deleteGoal(id) {
            confirmDialog('确定删除这个目标吗？', async () => {
                await api(`/api/fitness-goals/${id}`, { method: 'DELETE' });
                renderGoals();
                loadDashboard();
            });
        }
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
        }
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        // ===== 一键备份 / 恢复 =====
        function showConfirm(title, msg, btnText) {
            const overlay = document.getElementById('modalOverlay');
            overlay.innerHTML = `
            <div class="modal" style="width:340px;text-align:center;">
                <div style="font-size:2.2rem;margin-bottom:8px;">✅</div>
                <h3 style="margin-bottom:8px;">${title}</h3>
                <p style="font-size:0.9rem;margin-bottom:20px;color:var(--text);line-height:1.6;">${msg}</p>
                <div class="modal-actions" style="justify-content:center;">
                    <button class="btn btn-primary" onclick="closeModal()">${btnText || '好的'}</button>
                </div>
            </div>`;
            overlay.classList.add('open');
        }

        function confirmDialogAsync(title, msg, okText, cancelText) {
            return new Promise((resolve) => {
                const overlay = document.getElementById('modalOverlay');
                overlay.innerHTML = `
                <div class="modal" style="width:340px;text-align:center;">
                    <div style="font-size:2.2rem;margin-bottom:8px;">🤔</div>
                    <h3 style="margin-bottom:8px;">${title}</h3>
                    <p style="font-size:0.9rem;margin-bottom:20px;color:var(--text);line-height:1.6;">${msg}</p>
                    <div class="modal-actions" style="justify-content:center;">
                        <button class="btn btn-outline" onclick="closeModal();resolve(false)">${cancelText || '取消'}</button>
                        <button class="btn btn-danger" onclick="closeModal();resolve(true)">${okText || '确定'}</button>
                    </div>
                </div>`;
                overlay.classList.add('open');
            });
        }

        async function exportBackup() {
            try {
                const data = await LocalDB.exportBackupData();
                const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const d = new Date();
                const fname = `指挥部备份_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
                a.href = url;
                a.download = fname;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showConfirm('💾 备份已生成！', '文件已保存。建议发到微信「文件传输助手」存起来。<br>以后换手机时点「恢复备份」选择这个文件即可。', '好的');
            } catch (e) {
                alert('备份失败：' + e.message);
            }
        }

        async function importBackup(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            input.value = '';
            try {
                const text = await file.text();
                const data = JSON.parse(text);
                const ok = await confirmDialogAsync('📥 恢复备份', '恢复会<strong>覆盖</strong>手机里的当前数据，确定继续吗？', '确定恢复', '取消');
                if (!ok) return;
                await LocalDB.importBackupData(data);
                showConfirm('✅ 恢复成功！', '数据已恢复，正在刷新页面...', '好的');
                setTimeout(() => location.reload(), 1200);
            } catch (e) {
                alert('恢复失败：' + e.message + '（请确认选择的是备份生成的 .json 文件）');
            }
        }


        // Custom confirm dialog (works reliably on mobile browsers where native confirm() may fail)
        function confirmDialog(message, onConfirm) {
            const overlay = document.getElementById('modalOverlay');
            overlay.innerHTML = `
            <div class="modal" style="width:340px;text-align:center;">
                <div style="font-size:2.2rem;margin-bottom:8px;">🤔</div>
                <p style="font-size:0.95rem;margin-bottom:20px;color:var(--text);">${esc(message)}</p>
                <div class="modal-actions" style="justify-content:center;">
                    <button class="btn btn-outline" onclick="closeModal()">取消</button>
                    <button class="btn btn-danger" id="confirmOkBtn">确定删除</button>
                </div>
            </div>`;
            overlay.classList.add('open');
            document.getElementById('confirmOkBtn').addEventListener('click', () => {
                closeModal();
                if (typeof onConfirm === 'function') onConfirm();
            });
        }

        function esc(s) {
            if (!s) return '';
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        // ===== Init =====
        loadDashboard();
    </script>
</body>
</html>
