        </div>
    </div>

    <!-- ===== Bottom Navigation (mobile) ===== -->
    <nav class="bottom-nav" id="bottomNav">
        <button class="bn-item active" data-page="dashboard">
            <span class="bn-icon">📊</span><span class="bn-text">概览</span>
        </button>
        <button class="bn-item" data-page="tasks">
            <span class="bn-icon">📋</span><span class="bn-text">待办</span>
            <span class="badge" id="bnPendingBadge" style="display:none;">0</span>
        </button>
        <button class="bn-item" data-page="calendar">
            <span class="bn-icon">📅</span><span class="bn-text">日历</span>
        </button>
        <button class="bn-item" data-page="notes">
            <span class="bn-icon">📝</span><span class="bn-text">笔记</span>
        </button>
        <button class="bn-item" data-page="habits">
            <span class="bn-icon">🔥</span><span class="bn-text">习惯</span>
        </button>
        <button class="bn-item" data-page="fitness">
            <span class="bn-icon">💪</span><span class="bn-text">健身</span>
        </button>
        <button class="bn-item" data-page="diary">
            <span class="bn-icon">📖</span><span class="bn-text">日记</span>
        </button>
        <button class="bn-item" data-page="money">
            <span class="bn-icon">💰</span><span class="bn-text">记账</span>
        </button>
        <button class="bn-item" data-page="storage">
            <span class="bn-icon">🗄️</span><span class="bn-text">更多</span>
        </button>
    </nav>

    <!-- ===== Image Viewer ===== -->
    <div class="image-viewer" id="imageViewer" onclick="this.classList.remove('open')">
        <img id="imageViewerImg" src="" alt="">
    </div>

    <!-- ===== Modal ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <script src="localdb.js"></script>
    <script src="seed_images.js"></script>
    <script>
        // ===== State =====
        const state = {
            tasks: [],
            notes: [],
            schedules: [],
            calendarYear: new Date().getFullYear(),
            calendarMonth: new Date().getMonth() + 1,
        };

        // ===== 错误日志（诊断"闪退"用）：记录到 localStorage，最多 30 条 =====
        function logErr(msg) {
            try {
                const arr = JSON.parse(localStorage.getItem('wb_errlog') || '[]');
                arr.push(new Date().toLocaleString('zh-CN') + ' ' + String(msg).slice(0, 300));
                if (arr.length > 30) arr.splice(0, arr.length - 30);
                localStorage.setItem('wb_errlog', JSON.stringify(arr));
            } catch (e) { /* ignore */ }
        }
        window.addEventListener('error', (e) => {
            logErr('JS: ' + (e.message || '') + ' @' + (e.filename || '').split('/').pop() + ':' + (e.lineno || ''));
        });
        window.addEventListener('unhandledrejection', (e) => {
            const r = e.reason;
            logErr('Promise: ' + (r && r.message ? r.message : String(r)).slice(0, 300));
        });

        // ===== Navigation =====
        const ALL_PAGES = ['dashboard', 'tasks', 'calendar', 'notes', 'habits', 'review', 'fitness', 'diary', 'money', 'storage'];
        // 记住当前页面：闪退/系统杀后台/刷新后能回到原页面，而不是强制回概览
        function rememberPage(page) {
            try { localStorage.setItem('wb_last_page', page); } catch (e) { /* ignore */ }
        }
        function goToPage(page, title) {
            document.querySelectorAll('.nav-item, .bn-item').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            // Add active to BOTH sidebar nav-item and bottom nav bn-item for this page.
            // (The hidden one is display:none, so only the visible one shows highlight.)
            document.querySelectorAll(`.nav-item[data-page="${page}"], .bn-item[data-page="${page}"]`).forEach(b => b.classList.add('active'));
            document.getElementById(`page-${page}`).classList.add('active');
            document.getElementById('pageTitle').textContent = title;
            rememberPage(page);
            try {
                if (page === 'dashboard') loadDashboard();
                if (page === 'tasks') renderTasks();
                if (page === 'calendar') renderCalendar();
                if (page === 'notes') renderNotes();
                if (page === 'fitness') loadFitness();
                if (page === 'diary') loadDiary();
                if (page === 'money') loadMoney();
                if (page === 'storage') renderStorage();
                if (page === 'habits') renderHabits();
                if (page === 'review') renderReview();
            } catch (e) {
                // 页面渲染出错时不白屏：记录错误并给提示，而不是让页面卡死
                logErr('goToPage ' + page + ': ' + (e && e.message ? e.message : e));
            }
        }
        document.querySelectorAll('.nav-item, .bn-item').forEach(btn => {
            btn.addEventListener('click', () => {
                const title = btn.dataset.title || (btn.querySelector('.bn-text') ? btn.querySelector('.bn-text').textContent.trim() : btn.textContent.trim());
                goToPage(btn.dataset.page, title);
            });
        });

        // Fitness tabs
        document.addEventListener('click', (e) => {
            const tab = e.target.closest('.fitness-tab');
            if (!tab) return;
            document.querySelectorAll('.fitness-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.fitness-panel').forEach(p => p.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(`panel-${tab.dataset.panel}`).classList.add('active');
            if (tab.dataset.panel === 'metrics') renderMetricsChart();
            if (tab.dataset.panel === 'goals') renderGoals();
            if (tab.dataset.panel === 'actions') {
                if (ACTION_LIBRARY_LOADED) renderActionLibrary();
                else loadActionLibrary().then(renderActionLibrary);
            }
        });

        // ===== Date display =====
        function updateDateDisplay() {
            const now = new Date();
            const opts = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('zh-CN', opts);
        }
        updateDateDisplay();

        // ===== API helpers =====
        async function api(path, opts = {}) {
            const res = await fetch(path, {
                headers: { 'Content-Type': 'application/json' },
                ...opts,
            });
            return res.json();
        }

        // ===== Dashboard =====
        async function loadDashboard() {
            const stats = await api('/api/stats');
            const statsGrid = document.getElementById('statsGrid');
            const cards = [
                { label: '待办总数', value: stats.total_tasks, cls: '', page: 'tasks', title: '📋 待办' },
                { label: '待完成', value: stats.pending_tasks, cls: 'warn', page: 'tasks', title: '📋 待办' },
                { label: '今日待办', value: stats.today_tasks, cls: stats.today_tasks > 0 ? 'warn' : 'good', page: 'tasks', title: '📋 待办' },
                { label: '已逾期', value: stats.overdue_tasks, cls: stats.overdue_tasks > 0 ? 'danger' : '', page: 'tasks', title: '📋 待办' },
                { label: '笔记数', value: stats.notes_count, cls: '', page: 'notes', title: '📝 笔记' },
                { label: '本周训练', value: stats.workouts_this_week, cls: stats.workouts_this_week > 0 ? 'good' : '', page: 'fitness', title: '💪 健身' },
                { label: '最新体重', value: stats.latest_weight ? stats.latest_weight + 'kg' : '--', cls: '', page: 'fitness', title: '💪 健身' },
                { label: '活跃目标', value: stats.active_goals, cls: stats.active_goals > 0 ? 'warn' : '', page: 'fitness', title: '💪 健身' },
                { label: '习惯打卡', value: stats.habit_total ? `${stats.habit_done_today}/${stats.habit_total}` : '--', cls: (stats.habit_total && stats.habit_done_today === stats.habit_total) ? 'good' : (stats.habit_total ? 'warn' : ''), page: 'habits', title: '🔥 习惯' },
                { label: '本月收入', value: '¥' + (stats.month_income || 0), cls: 'good', page: 'money', title: '💰 记账' },
                { label: '本月支出', value: '¥' + (stats.month_expense || 0), cls: (stats.month_expense || 0) > 0 ? 'warn' : '', page: 'money', title: '💰 记账' },
                { label: '本月结余', value: '¥' + (stats.month_balance || 0), cls: (stats.month_balance || 0) >= 0 ? 'good' : 'danger', page: 'money', title: '💰 记账' },
            ];
            statsGrid.innerHTML = cards.map(c =>
                `<div class="stat-card" ${c.page ? `data-page="${c.page}" data-title="${c.title}"` : ''}><div class="label">${c.label}</div><div class="value ${c.cls}">${c.value}</div></div>`
            ).join('');
            // 概览卡片点击跳转到对应页面
            statsGrid.querySelectorAll('.stat-card[data-page]').forEach(card => {
                card.addEventListener('click', () => {
                    goToPage(card.dataset.page, card.dataset.title);
                });
            });

            // Today's tasks
            const tasks = await api('/api/tasks?status=active');
            const todayTasks = tasks.filter(t => {
                if (!t.due_date) return false;
                const d = new Date(t.due_date);
                const today = new Date();
                return d.getFullYear() === today.getFullYear() &&
                       d.getMonth() === today.getMonth() &&
                       d.getDate() === today.getDate();
            });
            const container = document.getElementById('todayTasks');
            if (todayTasks.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">🎉</div><p>今天没有待办，放松一下吧！</p></div>';
            } else {
                container.innerHTML = todayTasks.map(t =>
                    `<div class="task-item ${statusItemClass(t)}" style="margin-bottom:6px;">
                        <div style="display:flex;gap:4px;flex-shrink:0;">
                            <div class="checkbox ${t.completed ? 'checked' : ''}" onclick="toggleTask(${t.id})"></div>
                            <div class="checkbox-skip ${t.skipped ? 'skipped' : ''}" onclick="toggleTaskSkip(${t.id})">✕</div>
                        </div>
                        <div class="task-body">
                            <div class="task-title ${t.completed || t.skipped ? 'done' : ''}">${esc(t.title)}</div>
                            <div class="task-meta"><span class="tag tag-${t.priority}">${priorityLabel(t.priority)}</span></div>
                        </div>
                    </div>`
                ).join('');
            }

            // Update badge
            document.getElementById('pendingBadge').textContent = stats.pending_tasks;
            updatePendingBadges(stats.pending_tasks);

            // Today's workout
            const todayWorkoutEl = document.getElementById('todayWorkout');
            if (stats.has_today_workout) {
                const wtype = stats.today_workout_type === 'strength' ? '力量训练 💪' :
                              stats.today_workout_type === 'cardio' ? '有氧运动 🏃' : '混合训练 🔀';
                todayWorkoutEl.innerHTML = `
                    <div class="stat-card" style="margin-bottom:16px;">
                        <div class="label">今日训练</div>
                        <div class="value good">${wtype}</div>
                    </div>`;
            } else {
                todayWorkoutEl.innerHTML = '';
            }
        }

        // ===== Tasks =====
        async function renderTasks() {
            const search = document.getElementById('taskSearch').value.toLowerCase();
            const category = document.getElementById('filterCategory').value;
            const status = document.getElementById('filterStatus').value;
            const query = new URLSearchParams();
            if (category !== 'all') query.set('category', category);
            if (status !== 'all') query.set('status', status);
            let tasks = await api(`/api/tasks?${query}`);

            if (search) {
                tasks = tasks.filter(t => t.title.toLowerCase().includes(search));
            }
            state.tasks = tasks;

            const list = document.getElementById('taskList');
            if (tasks.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>暂无待办，建一个吧！</p></div>';
                return;
            }
            list.innerHTML = tasks.map(t => {
                const isOverdue = t.due_date && !t.completed && new Date(t.due_date) < new Date(new Date().toDateString());
                const repeatIcon = t.repeat === 'custom'
                    ? `🔄${formatRepeatDays(t.repeat_days)}`
                    : { daily: '🔄每天', weekdays: '🔄工作日', weekly: '🔄每周', monthly: '🔄每月' }[t.repeat] || '';
                return `
                <div class="task-item ${statusItemClass(t)}">
                    <div style="display:flex;gap:4px;flex-shrink:0;">
                        <div class="checkbox ${t.completed ? 'checked' : ''}" onclick="toggleTask(${t.id})"></div>
                        <div class="checkbox-skip ${t.skipped ? 'skipped' : ''}" onclick="toggleTaskSkip(${t.id})">✕</div>
                    </div>
                    <div class="task-body">
                        <div class="task-title ${t.completed || t.skipped ? 'done' : ''}" style="cursor:pointer;" onclick="event.stopPropagation();showTaskSchedule(${t.id})" title="查看这个任务的日程">${esc(t.title)}</div>
                        <div class="task-meta">
                            <span class="tag tag-${t.priority}">${priorityLabel(t.priority)}</span>
                            <span class="tag tag-${t.category}">${categoryLabel(t.category)}</span>
                            <span class="tag tag-schedule" style="cursor:pointer;" onclick="event.stopPropagation();showTaskSchedule(${t.id})">🗓 日程</span>
                            ${t.due_date ? `<span>📅 ${t.due_date}</span>` : ''}
                            ${t.due_time ? `<span>⏰ ${t.due_time}</span>` : ''}
                            ${repeatIcon ? `<span class="tag tag-repeat">${repeatIcon}</span>` : ''}
                            ${isOverdue ? '<span class="tag tag-overdue">⚠ 已逾期</span>' : ''}
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-sm btn-outline" onclick="editTask(${t.id})">✏️</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteTask(${t.id})">🗑</button>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('pendingBadge').textContent = tasks.filter(t => !t.completed).length;
            updatePendingBadges(tasks.filter(t => !t.completed).length);
        }

        function updatePendingBadges(count) {
            const bn = document.getElementById('bnPendingBadge');
            if (!bn) return;
            bn.textContent = count;
            bn.style.display = count > 0 ? 'inline-block' : 'none';
        }

        function priorityLabel(p) {
            return { high: '高优先', medium: '中优先', low: '低优先' }[p] || p;
        }
        function categoryLabel(c) {
            return { life: '生活', work: '工作' }[c] || '生活';
        }
        function statusItemClass(t) {
            return t.completed ? 'done-item' : t.skipped ? 'skipped-item' : 'todo-item';
        }

        function formatRepeatDays(daysStr) {
            if (!daysStr) return '';
            const names = ['一', '二', '三', '四', '五', '六', '日'];
            const days = daysStr.split(',').map(Number).sort((a, b) => a - b);
            return '周' + days.map(d => names[d]).join('');
        }

        async function toggleTask(id) {
            const task = state.tasks.find(t => t.id === id) || await api(`/api/tasks/${id}`);
            await api(`/api/tasks/${id}`, {
                method: 'PUT',
                body: JSON.stringify({ completed: !task.completed }),
            });
            renderTasks();
            loadDashboard();
        }

        async function toggleTaskSkip(id) {
            const task = state.tasks.find(t => t.id === id) || await api(`/api/tasks/${id}`);
            await api(`/api/tasks/${id}`, {
                method: 'PUT',
                body: JSON.stringify({ skipped: !task.skipped }),
            });
            renderTasks();
            loadDashboard();
        }

        async function deleteTask(id) {
            confirmDialog('确定删除这个待办吗？', async () => {
                await api(`/api/tasks/${id}`, { method: 'DELETE' });
                renderTasks();
                loadDashboard();
            });
        }

        function openTaskModal(task) {
            const overlay = document.getElementById('modalOverlay');
            const isEdit = !!task;
            overlay.innerHTML = `
            <div class="modal">
                <h3>${isEdit ? '编辑待办' : '新建待办'}</h3>
                <div class="form-group">
                    <label>标题 *</label>
                    <input id="taskTitle" value="${isEdit ? esc(task.title) : ''}" placeholder="写点什么...">
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="taskDesc">${isEdit ? esc(task.description) : ''}</textarea>
                </div>
                <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    <div>
                        <label>优先级</label>
                        <select id="taskPriority">
                            <option value="high" ${isEdit && task.priority === 'high' ? 'selected' : ''}>高</option>
                            <option value="medium" ${!isEdit || task.priority === 'medium' ? 'selected' : ''}>中</option>
                            <option value="low" ${isEdit && task.priority === 'low' ? 'selected' : ''}>低</option>
                        </select>
                    </div>
                    <div>
                        <label>分类</label>
                        <select id="taskCategory">
                            <option value="work" ${!isEdit || task.category === 'work' ? 'selected' : ''}>💼 工作</option>
                            <option value="life" ${isEdit && task.category === 'life' ? 'selected' : ''}>🏠 生活</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    <div>
                        <label>截止日期（可选）</label>
                        <input id="taskDue" type="date" value="${isEdit && task.due_date ? task.due_date : todayStr()}">
                        <div class="input-hint">默认今天 · 留空则放在「未安排日期」</div>
                    </div>
                    <div>
                        <label>时间（可选）</label>
                        <input id="taskDueTime" type="time" value="${isEdit && task.due_time ? task.due_time : ''}">
                    </div>
                </div>
                <div class="form-group">
                    <label>重复</label>
                    <select id="taskRepeat" onchange="toggleRepeatDays(this.value)">

        function getHolidayInfo(dateStr) {
            if (CN_HOLIDAYS_2026[dateStr]) return { type: 'holiday', label: CN_HOLIDAYS_2026[dateStr] };
            if (CN_WORKDAYS_2026[dateStr]) return { type: 'workday', label: CN_WORKDAYS_2026[dateStr] };

        async function renderCalendar() {
            const year = state.calendarYear;
            const month = state.calendarMonth;
            const firstDay = new Date(year, month - 1, 1);
            const lastDay = new Date(year, month, 0);
            const startDay = (firstDay.getDay() + 6) % 7; // Monday-first: 0=Mon
            const daysInMonth = lastDay.getDate();
            const daysInPrevMonth = new Date(year, month - 1, 0).getDate();

            document.getElementById('calendarTitle').textContent = `${year}年 ${month}月`;

            const [schedules, workouts, tasks, anniversaries] = await Promise.all([
                api(`/api/schedules?year=${year}&month=${month}`),
                api(`/api/workouts?year=${year}&month=${month}`),
                api(`/api/tasks?year=${year}&month=${month}`),
                api('/api/anniversaries'),
            ]);

            // Anniversary countdown banner (next upcoming anniversaries)
            renderAnnivCountdown(anniversaries);

            let html = '';
            const weekDays = ['一', '二', '三', '四', '五', '六', '日'];
            weekDays.forEach(d => {
                html += `<div class="day-header">${d}</div>`;
            });

            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

            // Previous month days (clickable -> jump to that month)
            const prevMonthDate = new Date(year, month - 2, 1);  // 0-based month of prev month
            const prevYear = prevMonthDate.getFullYear();
            const prevMonthNum = prevMonthDate.getMonth() + 1;
            for (let i = startDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                const dateStr = `${prevYear}-${String(prevMonthNum).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                html += `<div class="day-cell other-month" onclick="jumpToDate('${dateStr}')"><div class="day-num">${day}</div></div>`;
            }

            // Current month days
            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = today.getFullYear() === year && today.getMonth() + 1 === month && today.getDate() === d;
                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const daySchedules = schedules.filter(s => s.date === dateStr);
                const dayWorkout = workouts.find(w => w.date === dateStr);
                const dayTasks = tasks.filter(t => t.due_date === dateStr);
                const holiday = getHolidayInfo(dateStr);

                // Anniversary on this date (match month/day for yearly ones)
                const dayAnnivs = anniversaries.filter(a => {
                    const ad = new Date(a.anniv_date);
                    return a.yearly
                        ? (ad.getMonth() + 1 === month && ad.getDate() === d)
                        : a.anniv_date === dateStr;
                });

                // Holiday / make-up workday tag next to day number
                let holidayTag = '';
                if (holiday) {
                    const cls = holiday.type === 'holiday' ? 'holiday-tag' : 'workday-tag';
                    holidayTag = `<span class="${cls}">${holiday.label}</span>`;
                }
                // Anniversary tag
                let annivTag = '';
                if (dayAnnivs.length > 0) {
                    annivTag = `<span class="anniv-tag">🎂 ${dayAnnivs.map(a => esc(a.name)).join('·')}</span>`;
                }

                // Build cell items: workouts first, then tasks, then schedules
                const items = [];
                if (dayWorkout) {
                    const wlabel = dayWorkout.workout_type === 'strength' ? '💪 力量' : dayWorkout.workout_type === 'cardio' ? '🏃 有氧' : '🔀 混合';
                    items.push(`<div class="cell-item workout-item">${wlabel}</div>`);
                }
                dayTasks.forEach(t => {
                    const isFuture = dateStr > todayStr;
                    const cls = t.completed ? ' done' : t.skipped ? ' skipped' : (isFuture ? '' : ' todo');
                    const mark = t.completed || t.skipped || isFuture ? '' : '✕ ';
                    items.push(`<div class="cell-item todo-${t.category}${cls}" title="查看这个任务的日程" onclick="event.stopPropagation();showTaskSchedule(${t.id},'${dateStr}')">${mark}${esc(t.title)}</div>`);
                });
                daySchedules.forEach(s => {
                    items.push(`<div class="cell-item schedule-item${s.completed ? ' done' : ''}" style="--sc:${s.color}" title="查看这个日程的安排" onclick="event.stopPropagation();showScheduleTimeline(${s.id},'${dateStr}')">${esc(s.title)}${s.time ? ' ' + esc(s.time) : ''}</div>`);
                });

                // Show up to 4 items in the cell, rest as "+N 更多"
                const MAX = 4;
                const visible = items.slice(0, MAX);
                const extra = items.length - MAX;
                const itemsHtml = visible.length
                    ? `<div class="cell-items">${visible.join('')}${extra > 0 ? `<div class="more-items">+${extra} 更多</div>` : ''}</div>`
                    : '';

                html += `<div class="day-cell ${isToday ? 'today' : ''} ${holiday ? 'has-holiday' : ''}" onclick="openDayDetail('${dateStr}')">
                    <div class="day-num">${d}${holidayTag}${annivTag}</div>
                    ${itemsHtml}
                </div>`;
            }

            // Next month days (clickable -> jump to that month)
            const nextMonthDate = new Date(year, month, 1);  // 0-based month of next month
            const nextYear = nextMonthDate.getFullYear();
            const nextMonthNum = nextMonthDate.getMonth() + 1;
            const totalCells = startDay + daysInMonth;
            const remaining = (7 - (totalCells % 7)) % 7;
            for (let d = 1; d <= remaining; d++) {
                const dateStr = `${nextYear}-${String(nextMonthNum).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                html += `<div class="day-cell other-month" onclick="jumpToDate('${dateStr}')"><div class="day-num">${d}</div></div>`;
            }

            document.getElementById('calendarGrid').innerHTML = html;
            renderScheduleList(schedules);
            renderNoDateTasks(tasks);
        }

        // ===== Anniversary helpers =====
        function nextAnnivDate(anniv, fromDate) {
            // For yearly: next occurrence from today (this year or next year)
            const ad = new Date(anniv.anniv_date);
            if (!anniv.yearly) return new Date(anniv.anniv_date);
            const cand = new Date(fromDate.getFullYear(), ad.getMonth(), ad.getDate());
            if (cand < new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate())) {
                cand.setFullYear(fromDate.getFullYear() + 1);
            }
            return cand;
        }

        async function renderAnnivCountdown(anniversaries) {
            const el = document.getElementById('annivCountdown');
            if (!el) return;
            if (!anniversaries || anniversaries.length === 0) {
                el.innerHTML = `<div class="anniv-card anniv-empty" onclick="openAnniversaryModal()">
                    <div class="ac-name">🎂 添加纪念日</div>
                    <div class="ac-date">生日、纪念日不忘记</div>
                </div>`;
                return;
            }
            const today = new Date();
            // Sort by days until next occurrence
            const upcoming = anniversaries
                .map(a => {
                    const next = nextAnnivDate(a, today);
                    const days = Math.round((next - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
                    return { ...a, next, days };
                })
                .sort((a, b) => a.days - b.days)
                .slice(0, 5);
            el.innerHTML = upcoming.map(a => {
                const daysLabel = a.days === 0 ? '就是今天！' :
                    a.days === 1 ? '明天' : `还有 ${a.days} 天`;
                return `
                <div class="anniv-card ${a.days === 0 ? 'days0' : ''}" onclick="openAnniversaryModal()">
                    <div class="ac-name">🎂 ${esc(a.name)}</div>
                    <div class="ac-date">${a.next.getMonth() + 1}月${a.next.getDate()}日 ${a.yearly ? '· 每年' : ''}</div>
                    <div class="ac-days">${daysLabel}${a.days !== 0 && a.days !== 1 ? '<small> 后</small>' : ''}</div>
                </div>`;
            }).join('');
        }

        function jumpToDate(dateStr) {
            const parts = dateStr.split('-');
            state.calendarYear = parseInt(parts[0]);

        function changeMonth(delta) {
            if (delta === 0) {
                state.calendarYear = new Date().getFullYear();
                state.calendarMonth = new Date().getMonth() + 1;
            } else {
                state.calendarMonth += delta;
                if (state.calendarMonth > 12) { state.calendarMonth = 1; state.calendarYear++; }
                if (state.calendarMonth < 1) { state.calendarMonth = 12; state.calendarYear--; }
            }
            renderCalendar();
        }

        // ===== 任务日程时间线：点任务 → 显示这个任务在哪些日期有安排 =====
        function weekdayCN(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
        }

        function repeatLabel(t) {
            const r = t.repeat;
            if (!r || r === 'none') return '仅一次';
            if (r === 'daily') return '每天';
            if (r === 'weekdays') return '每个工作日';
            if (r === 'weekly') return '每周一次';
            if (r === 'monthly') return '每月一次';
            if (r === 'custom') {
                const names = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
                const days = String(t.repeat_days || '').split(',').map(x => parseInt(x)).filter(n => !isNaN(n) && n >= 0 && n <= 6);
                return days.length ? '每周' + days.map(d => names[d]).join('、') : '每周';
            }
            return r;
        }

        async function showTaskSchedule(taskId, fromDate) {
            const [allTasks, logs] = await Promise.all([
                api('/api/tasks'),
                api('/api/task-logs'),
            ]);
            const t = allTasks.find(x => x.id === taskId);
            if (!t) return;
            const now = new Date();
            const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const isRepeat = t.repeat && t.repeat !== 'none';

            // 日志状态映射
            const logMap = {};
            logs.filter(l => l.task_id === taskId).forEach(l => { logMap[l.date] = l.status || 'done'; });

            // 收集所有日程日期: { date: 'done'|'skipped'|'missed'|'future' }
            const dates = {};
            const setDate = (ds) => {
                if (!ds || dates[ds]) return;
                if (logMap[ds] && ds <= todayStr) dates[ds] = logMap[ds];  // 过去的日志：done/skipped
                else dates[ds] = ds <= todayStr ? 'missed' : 'future';      // 过去未做 / 未来待做
            };

            if (isRepeat) {
                // 从 repeat_start 所在月展开到未来 6 个月
                const start = t.repeat_start || t.due_date;
                let sy = now.getFullYear(), sm = now.getMonth() + 1;
                if (start) { sy = parseInt(start.slice(0, 4)); sm = parseInt(start.slice(5, 7)); }
                const endDate = new Date(now.getFullYear(), now.getMonth() + 6, 1);
                const ey = endDate.getFullYear(), em = endDate.getMonth() + 1;
                let y = sy, m = sm, guard = 0;
                while (guard++ < 300) {
                    const occ = window.LocalDB.expandRepeatInMonth(t, y, m);
                    if (occ) occ.forEach(setDate);
                    if (y === ey && m === em) break;
                    m++;
                    if (m > 12) { m = 1; y++; }
                }
            } else {
                setDate(t.due_date);
                if (t.due_date && !logMap[t.due_date]) {
                    dates[t.due_date] = t.completed ? 'done' : t.skipped ? 'skipped' : (t.due_date <= todayStr ? 'missed' : 'future');
                }
            }

            const sorted = Object.keys(dates).sort();
            const statusConf = {
                done:    { mark: '✅', label: '已做', color: '#9ca3af', line: true },
                skipped: { mark: '✕',  label: '跳过', color: '#ef4444', line: true },
                missed:  { mark: '❗',  label: '没做', color: '#ef4444', line: false },
                future:  { mark: '📅',  label: '待做', color: 'var(--text-primary)', line: false },
            };
            const rowsHtml = sorted.map(ds => {
                const st = statusConf[dates[ds]] || statusConf.future;
                const [yy, mm, dd] = ds.split('-').map(Number);
                const line = st.line ? 'text-decoration:line-through;' : '';
                const isToday = ds === todayStr;
                const dateLabel = `${mm}月${dd}日${yy !== now.getFullYear() ? '（' + yy + '年）' : ''}`;
                return `<div class="task-item" style="margin-bottom:4px;box-shadow:none;border:1px solid var(--border);cursor:pointer;" onclick="showTaskSchedule_jump('${ds}')">
                    <div style="width:4px;background:${st.color};border-radius:2px;flex-shrink:0;align-self:stretch;"></div>
                    <div class="task-body">
                        <div class="task-title" style="color:${st.color};${line}">${st.mark} ${dateLabel} ${weekdayCN(ds)}${isToday ? '（今天）' : ''}</div>
                        <div class="task-meta"><span>${st.label}</span>${ds < todayStr ? '<span>· 已过去</span>' : ''}</div>
                    </div>
                    <div style="font-size:0.75rem;color:var(--text-muted);flex-shrink:0;padding-top:6px;">查看 ›</div>
                </div>`;
            }).join('');

            const overlay = document.getElementById('modalOverlay');
            overlay.innerHTML = `
            <div class="modal" style="width:520px;display:flex;flex-direction:column;max-height:80vh;">
                <h3>📌 ${esc(t.title)}</h3>
                <div style="margin:-6px 0 10px;font-size:0.82rem;color:var(--text-muted);">
                    <span class="tag tag-${t.category}">${categoryLabel(t.category)}</span>
                    <span style="margin-left:6px;">🔁 ${repeatLabel(t)}</span>
                    ${isRepeat ? `<span style="margin-left:6px;">共 ${sorted.length} 次</span>` : ''}
                </div>
                <div style="flex:1;overflow-y:auto;min-height:0;margin-bottom:10px;">
                    ${rowsHtml || '<div style="color:var(--text-muted);font-size:0.85rem;padding:12px 0;text-align:center;">这个任务还没有安排日期</div>'}
                </div>
                <div class="modal-actions">
                    <button class="btn btn-outline" onclick="showTaskSchedule_jump('${todayStr}')">📍 回到今天</button>
                    ${fromDate ? `<button class="btn btn-outline" onclick="showTaskSchedule_jump('${fromDate}')">← 回到 ${parseInt(fromDate.slice(5, 7))}月${parseInt(fromDate.slice(8, 10))}日</button>` : ''}
                    <button class="btn btn-primary" onclick="closeModal()">关闭</button>
                </div>
            </div>`;
            overlay.classList.add('open');
        }

        // ===== 日程时间线：点日程（如背部刷酸/看中医）→ 显示这个日程的所有日期 =====
        async function showScheduleTimeline(id, fromDate) {
            const schedules = await api('/api/schedules');
            const s = schedules.find(x => x.id === id);
            if (!s) return;
            const now = new Date();
            const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            // 同名日程按日期排序（背部刷酸可能有 5/4、6/28、8/2 多条）
            const same = schedules.filter(x => x.title === s.title).sort((a, b) => a.date < b.date ? -1 : 1);
            const statusConf = {
                done:   { mark: '✅', label: '已做', color: '#9ca3af', line: true },
                missed: { mark: '❗', label: '没做', color: '#ef4444', line: false },
                future: { mark: '📅', label: '待做', color: 'var(--text-primary)', line: false },
            };
            const rowsHtml = same.map(x => {
                const st = x.completed ? statusConf.done : (x.date <= todayStr ? statusConf.missed : statusConf.future);
                const [yy, mm, dd] = x.date.split('-').map(Number);
                const line = st.line ? 'text-decoration:line-through;' : '';
                const isToday = x.date === todayStr;
                const dateLabel = `${mm}月${dd}日${yy !== now.getFullYear() ? '（' + yy + '年）' : ''}`;
                return `<div class="task-item" style="margin-bottom:4px;box-shadow:none;border:1px solid var(--border);cursor:pointer;" onclick="showTaskSchedule_jump('${x.date}')">
                    <div style="width:4px;background:${st.color};border-radius:2px;flex-shrink:0;align-self:stretch;"></div>
                    <div class="task-body">
                        <div class="task-title" style="color:${st.color};${line}">${st.mark} ${dateLabel} ${weekdayCN(x.date)}${isToday ? '（今天）' : ''}</div>
                        <div class="task-meta">
                            <span>${st.label}</span>
                            ${x.time ? `<span>🕐 ${esc(x.time)}</span>` : ''}
                            ${x.description ? `<span>${esc(x.description)}</span>` : ''}
                        </div>
                    </div>
                    <div style="font-size:0.75rem;color:var(--text-muted);flex-shrink:0;padding-top:6px;">查看 ›</div>
                </div>`;
            }).join('');

            const overlay = document.getElementById('modalOverlay');
            overlay.innerHTML = `
            <div class="modal" style="width:520px;display:flex;flex-direction:column;max-height:80vh;">
                <h3>📌 ${esc(s.title)}</h3>
                <div style="margin:-6px 0 10px;font-size:0.82rem;color:var(--text-muted);">
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.color};margin-right:4px;vertical-align:middle;"></span>
                    <span style="vertical-align:middle;">日程 · 共 ${same.length} 次</span>
                </div>
                <div style="flex:1;overflow-y:auto;min-height:0;margin-bottom:10px;">
                    ${rowsHtml || '<div style="color:var(--text-muted);font-size:0.85rem;padding:12px 0;text-align:center;">这个日程还没有记录</div>'}
                </div>
                <div class="modal-actions">
                    <button class="btn btn-outline" onclick="showTaskSchedule_jump('${todayStr}')">📍 回到今天</button>
                    ${fromDate ? `<button class="btn btn-outline" onclick="showTaskSchedule_jump('${fromDate}')">← 回到 ${parseInt(fromDate.slice(5, 7))}月${parseInt(fromDate.slice(8, 10))}日</button>` : ''}
                    <button class="btn btn-primary" onclick="closeModal()">关闭</button>
                </div>
            </div>`;
            overlay.classList.add('open');
        }

        // 一次性健康检查：统计已丢失的日记照片数并提示（不阻塞）
        let _diaryHealthChecked = false;
        async function checkDiaryImagesHealth() {
            if (_diaryHealthChecked) return;
            _diaryHealthChecked = true;
            try {
                const n = await LocalDB.countMissingImages();
                if (n > 0) {
                    const tip = document.getElementById('diaryHealthTip');
                    if (tip) {
                        tip.style.display = 'block';
                        tip.textContent = `⚠️ 检测到 ${n} 张日记照片数据已丢失（通常是被浏览器清理缓存）。以后请定期点「💾 一键备份」保存，遇到丢失可用备份恢复。`;
                    }
                }
            } catch (e) { /* 忽略 */ }

        async function renderDiaryCalendar() {
            const { year, month } = diaryState;
            const firstDay = new Date(year, month - 1, 1);
            const lastDay = new Date(year, month, 0);
            const startDay = (firstDay.getDay() + 6) % 7; // Monday-first: 0=Mon
            const daysInMonth = lastDay.getDate();
            const daysInPrevMonth = new Date(year, month - 1, 0).getDate();

            document.getElementById('diaryCalTitle').textContent = `${year}年 ${month}月`;
            const diaries = await api(`/api/diaries?year=${year}&month=${month}`);
            diaryState.monthDiaries = diaries;

            let html = '';
            const weekDays = ['一', '二', '三', '四', '五', '六', '日'];
            weekDays.forEach(d => { html += `<div class="day-header">${d}</div>`; });

            const today = new Date();
            for (let i = startDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                html += `<div class="day-cell other-month"><div class="day-num">${day}</div></div>`;
            }
            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = today.getFullYear() === year && today.getMonth() + 1 === month && today.getDate() === d;
                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayDiary = diaries.find(di => di.date === dateStr);
                const hasDiary = !!dayDiary;
                const hasImages = dayDiary && dayDiary.images && dayDiary.images.length > 0;
                const isSelected = dateStr === diaryState.selectedDate;

                // Content preview inside cell
                let diaryInfoHtml = '';
                if (hasDiary) {
                    const preview = (dayDiary.content || '').replace(/\n+/g, ' ').slice(0, 50);
                    diaryInfoHtml = preview ? `<div style="margin-top:2px;"><div class="diary-preview">${esc(preview)}</div></div>` : '';
                }

                // Build photo thumbnails (max 3 shown, tiny thumbs to save memory)
                let photosHtml = '';
                if (hasImages) {
                    const imgs = dayDiary.images.slice(0, 3);
                    const extra = dayDiary.images.length - 3;
                    photosHtml = `<div class="diary-cell-photos">
                        ${imgs.map(it => {
                            const url = (typeof it === 'object' && it) ? (it.url || '') : it;
                            const thumb = (typeof it === 'object' && it) ? (it.thumb || url) : null;
                            const src = thumb || url;
                            return `<img src="${LocalDB.resolveImgSync(src)}" data-url="${esc(src)}" class="diary-img" loading="lazy" onclick="event.stopPropagation();viewImage('${url}')" alt="日记照片">`;
                        }).join('')}
                        ${extra > 0 ? `<span class="photo-more">📷+${extra}</span>` : ''}
                    </div>`;
                }

                html += `<div class="day-cell ${isToday ? 'today' : ''} ${hasDiary ? 'has-diary' : ''} ${isSelected ? 'selected' : ''}"
                    style="${isSelected ? 'outline:2px solid var(--primary);' : ''}"
                    onclick="selectDiaryDate('${dateStr}')">
                    <div class="day-num">${d}</div>
                    ${diaryInfoHtml}
                    ${photosHtml}
                    ${hasDiary && !hasImages && !dayDiary.mood && !(dayDiary.content || '').trim() ? '<div class="diary-mark">📖</div>' : ''}
                </div>`;
            }
            const totalCells = startDay + daysInMonth;
            const remaining = (7 - (totalCells % 7)) % 7;
            for (let d = 1; d <= remaining; d++) {
                html += `<div class="day-cell other-month"><div class="day-num">${d}</div></div>`;
            }
            document.getElementById('diaryCalGrid').innerHTML = html;
            fillDiaryImages(document.getElementById('diaryCalGrid'));
        }

        // 异步补齐日记图片：同步渲染时若缓存未就绪（显示占位图），

        async function handleDiaryFiles(input) {
            const files = Array.from(input.files || []);

            let successCount = 0;
            for (let i = 0; i < files.length; i++) {

                    if (statusEl) {
                        statusEl.textContent = `⏳ 正在上传 ${i + 1}/${files.length}...`;
                        statusEl.style.display = 'block';
                    }
                    const blob = await compressImage(file);
                    const fd = new FormData();
                    fd.append('file', blob, file.name.replace(/\.[^.]+$/, '') + '.jpg');
                    const res = await fetch('/api/upload', { method: 'POST', body: fd });
                    const data = await res.json();                    if (data.url) {
                        diaryImages.push(data.url);
                        successCount++;
                    } else {
                        alert(data.error || '上传失败');
                    }
                } catch (e) {
                    alert('图片处理失败：' + e.message);
                }
            }
            input.value = '';
            if (statusEl) {
                statusEl.textContent = successCount > 0 ? `✅ 已添加 ${successCount} 张照片` : '';
                setTimeout(() => { statusEl.style.display = 'none'; }, 2000);

            renderImagePreview();
        }

        async function compressImage(file) {
            const t = (file.type || '').toLowerCase();
            const name = (file.name || '').toLowerCase();
            const isHeic = t === 'image/heic' || t === 'image/heif' || /\.(heic|heif)$/.test(name);
            // OPPO 相机常把照片标成 HEIC/HEIF，先在浏览器端转成 JPEG。
            // 不能解码时不要再报“格式无法读取”并丢弃，直接上传原文件，保证照片不丢。
            if (isHeic && typeof window.heic2any === 'function') {
                try {
                    const converted = await window.heic2any({ blob: file, toType: 'image/jpeg', quality: 0.82 });
                    return Array.isArray(converted) ? converted[0] : converted;
                } catch (e) {
                    console.warn('[compress] HEIC 转 JPG 失败，尝试上传原文件', e);
                    return file;
                }
            }
            // 小体积的常规格式图片直接上传，省一次解码耗时。
            const isCommon = t === 'image/jpeg' || t === 'image/png' || t === 'image/webp' || t === 'image/gif';
            if (isCommon && file.size < 120 * 1024) return file;
            return new Promise((resolve) => {
                // Timeout guard: 老手机压缩卡住时上传原文件，不阻塞保存流程。
                const timer = setTimeout(() => { console.warn('[compress] 压缩超时，上传原文件'); resolve(file); }, 8000);
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        try {
                            const MAX = 1000;
                            let { width, height } = img;
                            if (width > MAX || height > MAX) {
                                const ratio = Math.min(MAX / width, MAX / height);
                                width = Math.round(width * ratio);
                                height = Math.round(height * ratio);
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            if (t === 'image/png' || t === 'image/webp') {
                                ctx.fillStyle = '#ffffff';
                                ctx.fillRect(0, 0, width, height);
                            }
                            ctx.drawImage(img, 0, 0, width, height);
                            clearTimeout(timer);
                            const finish = (blob) => resolve(blob || file);
                            if (typeof canvas.toBlob === 'function') {
                                canvas.toBlob(finish, 'image/jpeg', 0.62);
                            } else {
                                const dataUrl = canvas.toDataURL('image/jpeg', 0.62);
                                const bin = atob(dataUrl.split(',')[1]);
                                const arr = new Uint8Array(bin.length);
                                for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
                                finish(new Blob([arr], { type: 'image/jpeg' }));
                            }
                        } catch (err) {
                            clearTimeout(timer);
                            resolve(file);
                        }
                    };
                    img.onerror = () => { clearTimeout(timer); resolve(file); };
                    img.src = e.target.result;
                };
                reader.onerror = () => { clearTimeout(timer); resolve(file); };
                reader.readAsDataURL(file);
            });
        }

        async function saveDiary(id) {
            const data = {
                date: document.getElementById('dDate').value,
                title: document.getElementById('dTitle').value.trim(),
                content: document.getElementById('dContent').value,
                mood: _diaryMood,
                images: diaryImages,
            };
            if (!data.date) return alert('请选择日期');
            if (id) {
                await api(`/api/diaries/${id}`, { method: 'PUT', body: JSON.stringify(data) });
            } else {
                await api('/api/diaries', { method: 'POST', body: JSON.stringify(data) });

            closeModal();
            diaryState.selectedDate = data.date;
            await renderDiaryCalendar();
            await showDiaryEntry(data.date);
            loadDashboard();

        let moneyTrendChart = null;

        const EXPENSE_CATS = ['吃喝', '交通', '购物', '变美', '玩乐', '生活'];
        const INCOME_CATS = ['工资', '奖金', '理财', '兼职', '红包', '其他'];
        const CAT_ICONS = {
            '吃喝': '🍚', '交通': '🚗', '购物': '🛍️', '变美': '💄', '玩乐': '🎮', '生活': '🏠',

        async function saveTxn(id, type) {
            const amount = parseFloat(document.getElementById('tAmount').value);
            if (isNaN(amount) || amount <= 0) return alert('请输入有效金额');
            // 分类从按钮网格取选中项（没选中取第一个）
            const catBtns = document.querySelectorAll('#tCatGrid [data-cat]');
            const selected = Array.from(catBtns).find(b => b.style.borderColor === 'var(--primary)') || catBtns[0];
            const category = selected ? selected.dataset.cat : '其他';
            try { localStorage.setItem('wb_lastTxnCategory', category); } catch (e) {}
            const data = {
                date: document.getElementById('tDate').value,
                txn_type: id ? (await api(`/api/transactions/${id}`)).txn_type : type,
                amount: Math.round(amount * 100) / 100,
                category,
                note: document.getElementById('tNote').value.trim(),
            };
            if (id) {
                await api(`/api/transactions/${id}`, { method: 'PUT', body: JSON.stringify(data) });
            } else {
                await api('/api/transactions', { method: 'POST', body: JSON.stringify(data) });
            }

        // 一键拉取 AI 识别结果（推送到云端固定 URL）
        async function fetchAiPending() {
            const btn = event && event.target ? event.target : null;
            if (btn) { btn.textContent = '⏳ 拉取中...'; btn.disabled = true; }
            try {
                const url = './ai_pending.json?v=' + Date.now();
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                if (!data || !Array.isArray(data.items) || data.items.length === 0) {
                    throw new Error('还没有 AI 识别结果，先把截图发给 AI 吧');
                }
                // 兼容两种格式：带字段 / 纯字符串
                aiImportItems = data.items.map(it => {
                    if (typeof it === 'string') {
                        return parseAiLine(it);
                    }
                    return {
                        amount: Math.round(parseFloat(it.amount || it.price || 0) * 100) / 100,
                        category: it.category || '吃喝',
                        note: it.note || it.name || it.title || '',
                        txn_type: (it.type === 'income' || INCOME_CATS.includes(it.category || '')) ? 'income' : 'expense',
                        date: it.date || todayStr(),
                    };
                }).filter(i => i.amount > 0);
                if (aiImportItems.length === 0) throw new Error('识别结果里没有有效金额');
                renderAiReview();
            } catch (e) {
                alert('拉取失败：' + e.message);
            } finally {
                if (btn) { btn.textContent = '⬇️ 获取AI最新结果'; btn.disabled = false; }
            }
        }

        // 解析单行：金额|分类|备注
        function parseAiLine(line) {
            const parts = String(line).split(/[|｜,，;；]+/).map(s => s.trim()).filter(Boolean);
            if (parts.length === 0) return null;
            const amtMatch = String(line).match(/(\d+(?:\.\d{1,2})?)/);
            if (!amtMatch) return null;
            const amount = parseFloat(amtMatch[1]);
            const allCats = [...EXPENSE_CATS, ...INCOME_CATS];
            const catHit = allCats.find(c => String(line).includes(c));
            const cat = catHit || '吃喝';
            const note = String(line).replace(amtMatch[0], '').replace(cat, '').replace(/[¥￥元]|^\s*[:：]?\s*/, '').trim();
            return {
                amount: Math.round(amount * 100) / 100,
                category: cat,
                note,
                txn_type: INCOME_CATS.includes(cat) ? 'income' : 'expense',
                date: todayStr(),
            };
        }

        function parseAiImport() {
            const text = document.getElementById('aiImportText').value.trim();
            if (!text) return alert('请先粘贴 AI 识别结果');
            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
            const items = [];
            const fallbackCat = '吃喝';
            for (const line of lines) {
                // 支持多种分隔：| ｜ , ， ; ； 空格
                const parts = line.split(/[|｜,，;；]+/).map(s => s.trim()).filter(Boolean);
                if (parts.length === 0) continue;
                // 找金额（第一个纯数字/带¥/带元的）
                let amount = null, cat = fallbackCat, note = '', rest = parts;
                // 先尝试标准格式：金额在第一个位置
                const amtMatch = line.match(/(\d+(?:\.\d{1,2})?)/);
                if (amtMatch) {
                    amount = parseFloat(amtMatch[1]);
                }
                if (amount === null) continue;
                // 分类：从剩余文本匹配已知分类
                const allCats = [...EXPENSE_CATS, ...INCOME_CATS];
                const catHit = allCats.find(c => line.includes(c));
                if (catHit) cat = catHit;
                // 备注：去掉金额和分类后的剩余文本
                note = line.replace(amtMatch[0], '').replace(cat, '').replace(/[¥￥元]|^\s*[:：]?\s*/, '').trim();
                const isIncome = INCOME_CATS.includes(cat);
                items.push({
                    amount: Math.round(amount * 100) / 100,
                    category: cat,
                    note,
                    txn_type: isIncome ? 'income' : 'expense',
                    date: todayStr(),
                });
            }
            if (items.length === 0) return alert('没解析出有效账单，请检查格式（每行要有金额数字）');
            aiImportItems = items;
            renderAiReview();
        }

        // 提取纯文本摘要 + 统计清单进度（供卡片缩略显示）
        function noteSummary(text) {
            if (!text) return { text: '', total: 0, done: 0 };
            let total = 0, done = 0;
            const parts = [];
            for (const raw of text.split('\n')) {
                const line = raw.trim();
                if (!line) continue;
                const chk = line.match(/^[-*]\s+\[([ xX])\]\s*(.*)$/);
                if (chk) {
                    total++;
                    if (chk[1].toLowerCase() === 'x') done++;
                    if (chk[2].trim()) parts.push(chk[2].trim());
                    continue;
                }
                let t = line
                    .replace(/^#{1,6}\s+/, '')               // 标题
                    .replace(/^\s*>\s*/, '')                 // 引用
                    .replace(/^\s*[-*+]\s+/, '')             // 无序列表
                    .replace(/^\s*\d+\.\s+/, '')             // 有序列表
                    .replace(/^\s*\|.*\|\s*$/, mm => mm.replace(/\|/g, ' ').replace(/\s+/g, ' ').trim()) // 表格行
                    .replace(/^[-=|:]{3,}$/, '')             // 分隔线/表头
                    .replace(/```/g, '')
                    .replace(/\*\*|__|~~/g, '')              // 加粗/斜体标记
                    .replace(/\*([^*]+)\*/g, '$1')
                    .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1') // 图片
                    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')  // 链接
                    .replace(/`/g, '');
                if (t.trim()) parts.push(t.trim());
            }
            let summary = parts.join(' ').replace(/\s+/g, ' ');
            if (summary.length > 80) summary = summary.slice(0, 80) + '…';
            return { text: summary, total, done };
        }

        // 表格纠错：GFM 表格后紧跟的非空行会被吞进表格最后一行（无空行时）。
        // 检测到表格块后跟非表格文字，自动补一个空行，让文字回到表格外。
        function isTableLine(t) {
            if (!t.startsWith('|')) return false;
            return t.slice(1).includes('|'); // 除开头管道外还有管道 → 表格行（含分隔行/省略尾管道）
        }
        function fixTableEndings(text) {
            if (!text || text.indexOf('|') === -1) return text;
            const lines = text.split('\n');
            const out = [];
            let inCode = false;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                out.push(line);
                const t = line.trim();
                if (t.startsWith('```')) { inCode = !inCode; continue; }
                if (inCode) continue;
                if (isTableLine(t)) {
                    const next = (i + 1 < lines.length ? lines[i + 1] : '').trim();
                    if (next && !isTableLine(next) && !next.startsWith('```')) {
                        out.push(''); // 表格块后补空行，防止后面文字被吞
                    }
                }
            }
            return out.join('\n');
        }

        function renderMarkdown(text, noteId) {
            if (!text) return '<span style="color:var(--text-muted);">（空白笔记）</span>';
            try {
                if (window.marked) {
                    let html = marked.parse(fixTableEndings(text));
                    // 净化链接：仅允许 http/https/mailto/tel，防 javascript: XSS
                    html = html.replace(/<a\s+href=["']([^"']*)["']/gi, (match, href) => {
                        const h = (href || '').trim().toLowerCase();
                        if (h.startsWith('http://') || h.startsWith('https://') || h.startsWith('mailto:') || h.startsWith('tel:') || h.startsWith('#')) {
                            return match;
                        }
                        return '<a href="#" onclick="return false;"';
                    });
                    // 任务列表：marked 已生成 <input disabled type="checkbox">，去掉 disabled 变成可点击
                    // 用占位符保证顺序与原文一致（先标记全部，再按序替换）
                    const checkItems = [];
                    html = html.replace(/<li><input([^>]*)type="checkbox"([^>]*)>(.*?)<\/li>/gi, (m, before, after, content) => {
                        const isChecked = m.includes('checked=""');
                        checkItems.push({ content, isChecked });
                        return `<!--CHK_${checkItems.length - 1}-->`;
                    });
                    let idx = 0;
                    html = html.replace(/<!--CHK_(\d+)-->/g, (m, n) => {
                        const item = checkItems[parseInt(n, 10)];
                        if (noteId) {
                            return `<li class="task-item"><input type="checkbox" class="note-check"${item.isChecked ? ' checked' : ''} data-note-id="${noteId}" data-check-idx="${idx++}" onchange="toggleNoteCheck(this)">${item.content}</li>`;
                        }
                        return `<li class="task-item"><input type="checkbox" class="note-check"${item.isChecked ? ' checked' : ''} disabled>${item.content}</li>`;
                    });
                    return html;
                }
            } catch (e) { /* fallback */ }
            return esc(text).replace(/\n/g, '<br>');
        }

        function insertToNote(template) {
            const ta = document.getElementById('noteContent');
            const start = ta.selectionStart || ta.value.length;
            const end = ta.selectionEnd || start;
            let before = ta.value.slice(0, start);
            let after = ta.value.slice(end);
            // 多行块（表格/列表等）自动补前后换行，避免与相邻文字粘连
            if (template.includes('\n')) {
                if (before && !before.endsWith('\n')) template = '\n' + template;
                if (after && !after.startsWith('\n')) template = template + '\n';
            }
            ta.value = before + template + after;
            ta.focus();
        }

        async function toggleNoteCheck(el) {
            const noteId = el.dataset.noteId;
            const targetIdx = parseInt(el.dataset.checkIdx, 10);
            if (!noteId || isNaN(targetIdx)) return;
            try {
                const note = await api(`/api/notes/${noteId}`);
                const lines = note.content.split('\n');
                let found = -1;
                for (let i = 0; i < lines.length; i++) {
                    if (/^\s*-\s*\[[ xX]\]/.test(lines[i])) {
                        found++;
                        if (found === targetIdx) {
                            lines[i] = el.checked
                                ? lines[i].replace(/\[ \]/, '[x]')
                                : lines[i].replace(/\[[xX]\]/, '[ ]');
                            break;
                        }
                    }
                }
                if (found === targetIdx) {
                    await api(`/api/notes/${noteId}`, {
                        method: 'PUT',
                        body: JSON.stringify({ content: lines.join('\n') })
                    });
                    // 若详情弹窗开着，刷新弹窗内容同步勾选状态
                    if (_noteDetailId !== null) { await openNoteDetail(_noteDetailId); }
                }
            } catch (e) { console.error('toggleNoteCheck failed', e); }
        }

        function alMatches(action, query) {
            if (!query) return true;
            const q = query.toLowerCase().trim();
            return (action.name_cn || '').includes(query.trim()) ||
                   (action.name_en || '').toLowerCase().includes(q) ||
                   action.category.includes(q) ||
                   (action.equipment_cn || '').includes(q) ||
                   (action.main_muscle || '').includes(q);

        function renderActionLibrary() {
            const body = document.getElementById('alBody');
            if (!body) return;
            const search = (document.getElementById('alSearch')?.value || '').trim();
            const cat = CURRENT_AL_CAT;

            // 分类计数
            const catCount = {};
            AL_CATS.forEach(c => catCount[c] = 0);
            catCount['全部'] = ACTION_LIBRARY.length;
            ACTION_LIBRARY.forEach(a => {
                if (alMatches(a, search)) {
                    catCount[a.category] = (catCount[a.category] || 0) + 1;
                }
            });

            // 类别列表
            const catsHtml = AL_CATS.map(c => {
                const count = catCount[c] || 0;
                const disabled = count === 0 ? 'disabled' : '';
                const active = c === cat ? 'active' : '';
                return `<div class="al-cat-item ${active} ${disabled}" onclick="selectALCat('${c}')">${c} ${count}</div>`;
            }).join('');

            // 动作卡片
            const filtered = ACTION_LIBRARY.filter(a =>
                (cat === '全部' || a.category === cat) && alMatches(a, search)
            );

            if (filtered.length === 0) {
                body.innerHTML = `<div class="al-cats">${catsHtml}</div><div class="al-grid-wrap"><div class="al-empty">没有匹配的动作</div></div>`;

        // 把动作加入训练草稿（textarea 追加一行，不关 modal）
        function addActionToWorkout(id) {
            const a = ACTION_LIBRARY.find(x => x.id === id);

        // 体重日历
        async function renderWeightCal() {
            if (!_weightCalState) {
                const n = new Date();
                _weightCalState = { year: n.getFullYear(), month: n.getMonth() + 1 };
            }
            const y = _weightCalState.year, m = _weightCalState.month;
            const titleEl = document.getElementById('weightCalTitle');
            if (titleEl) titleEl.textContent = `${y}年 ${m}月`;
            const grid = document.getElementById('weightCalGrid');
            if (!grid) return;
            const metrics = await api('/api/body-metrics');
            const wmap = {};
            metrics.forEach(mm => { if (mm.date && mm.weight !== null && mm.weight !== undefined) wmap[mm.date] = mm.weight; });
            const todayDate = new Date();
            const todayStrVal = todayStr();
            const dows = ['日', '一', '二', '三', '四', '五', '六'];
            const firstDay = new Date(y, m - 1, 1).getDay();
            const daysInMonth = new Date(y, m, 0).getDate();
            let html = dows.map(d => `<div class="habit-cal-dow">${d}</div>`).join('');
            for (let i = 0; i < firstDay; i++) html += `<div class="weight-cal-day empty"></div>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const ds = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const w = wmap[ds];
                const isToday = ds === todayStrVal;
                const isFuture = new Date(y, m - 1, d) > new Date(todayDate.getFullYear(), todayDate.getMonth(), todayDate.getDate());
                let cls = 'weight-cal-day';
                if (isFuture) cls += ' future';
                else if (w !== undefined) cls += ' done';
                else cls += ' miss';
                if (isToday) cls += ' today';
                const wStr = w !== undefined ? (Math.round(w * 10) / 10).toFixed(1) : '';
                html += `<div class="${cls}" onclick="${isFuture ? '' : `openWeightModal('${ds}')`}">
                    <div class="wcd-date">${d}</div>
                    <div class="wcd-weight">${wStr}</div>
                </div>`;
            }
            grid.innerHTML = html;
        }

        function weightCalNav(delta) {
            if (!_weightCalState) { const n = new Date(); _weightCalState = { year: n.getFullYear(), month: n.getMonth() + 1 }; }
            _weightCalState.month += delta;
            if (_weightCalState.month < 1) { _weightCalState.month = 12; _weightCalState.year--; }
            if (_weightCalState.month > 12) { _weightCalState.month = 1; _weightCalState.year++; }
            renderWeightCal();
        }

        // 可爱称重弹窗
        async function openWeightModal(dateStr) {

            const existing = metrics.find(m => m.date === dateStr);
            const prevRecs = metrics.filter(m => m.date < dateStr && m.weight !== null && m.weight !== undefined).sort((a, b) => b.date.localeCompare(a.date));
            const prevW = prevRecs[0] ? prevRecs[0].weight : null;
            const curW = existing && existing.weight !== null && existing.weight !== undefined ? existing.weight : (prevW !== null ? prevW : '');
            const diff = (existing && existing.weight !== null && prevW !== null) ? Math.round((existing.weight - prevW) * 10) / 10 : null;
            const wd = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][new Date(dateStr + 'T00:00:00').getDay()];
            const overlay = document.getElementById('modalOverlay');

                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">

                        <g stroke="#fff" stroke-width="2.6" stroke-linecap="round">
                            <line x1="60" y1="24" x2="60" y2="33"/>
                            <line x1="83" y1="37" x2="77" y2="43"/>
                            <line x1="92" y1="60" x2="83" y2="60"/>
                            <line x1="83" y1="83" x2="77" y2="77"/>
                            <line x1="37" y1="37" x2="43" y2="43"/>
                            <line x1="28" y1="60" x2="37" y2="60"/>
                        </g>
                        <line x1="60" y1="60" x2="62" y2="26" stroke="#ffd54f" stroke-width="5" stroke-linecap="round"/>
                        <circle cx="60" cy="60" r="7" fill="#ffd54f"/>

                    <div class="weight-input-row">

                    </div>
                    <div class="weight-diff-note">${diff !== null ? `📊 较上次${diff > 0 ? '上升' : '下降'} ${Math.abs(diff)}kg` : (prevW !== null ? `📊 上次记录 ${prevW}kg` : '🎉 第一次记录体重！')}</div>
                </div>
                <div class="modal-actions">
                    ${existing ? `<button class="btn btn-outline" onclick="deleteMetricForDate('${dateStr}')">🗑 删除</button>` : ''}

                    <button class="btn btn-primary" onclick="saveWeight('${dateStr}')">✓ 保存</button>

            overlay.classList.add('open');
            const inp = document.getElementById('wInput');
            inp.focus();
            inp.select();
        }

        function nudgeWeight(delta) {
            const inp = document.getElementById('wInput');
            if (!inp) return;
            const v = parseFloat(inp.value);
            const nv = (isNaN(v) ? 0 : v) + delta;
            inp.value = Math.round(nv * 10) / 10;
            inp.focus();
        }

        async function saveWeight(dateStr) {
            const v = parseFloat(document.getElementById('wInput').value);
            if (isNaN(v) || v <= 0) return alert('请输入有效体重');
            const w = Math.round(v * 10) / 10;
            const metrics = await api('/api/body-metrics');
            const existing = metrics.find(m => m.date === dateStr);
            if (existing) {
                await api(`/api/body-metrics/${existing.id}`, { method: 'PUT', body: JSON.stringify({ weight: w }) });
            } else {
                await api('/api/body-metrics', { method: 'POST', body: JSON.stringify({ date: dateStr, weight: w }) });
            }
            closeModal();
            renderMetricsChart();
            loadDashboard();
        }

        async function deleteMetricForDate(dateStr) {
            const metrics = await api('/api/body-metrics');
            const rec = metrics.find(m => m.date === dateStr);
            if (!rec) return;
            confirmDialog(`确定删除 ${dateStr} 的记录吗？`, async () => {
                await api(`/api/body-metrics/${rec.id}`, { method: 'DELETE' });
                renderMetricsChart();
                loadDashboard();
            });
        }

        // 体重趋势折线图（体重专属，其他指标进完整记录）
        async function renderWeightChart(metrics) {
            const ctx = document.getElementById('weightChart');
            if (!ctx) return;
            if (weightChartInstance) { weightChartInstance.destroy(); weightChartInstance = null; }
            const withW = metrics.filter(m => m.weight != null);
            if (withW.length === 0) {
                ctx.parentElement.innerHTML = '<div class="empty-state" style="padding:20px;"><div class="icon">📉</div><p>暂无体重数据，点上面的「记录体重」开始吧！</p></div>';
                return;
            }
            // 每次重建可见 canvas（修复：旧逻辑复用空态留下的 display:none 画布导致图表永远不可见）
            ctx.parentElement.innerHTML = '<canvas id="weightChart" height="220"></canvas>';
            const canvas = document.getElementById('weightChart');
            // API 返回按日期降序(最新在前)，折线图需按时间升序，先排序再画
            const sorted = metrics.slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
            const labels = sorted.map(m => m.date.slice(5));
            const weightData = sorted.map(m => m.weight != null ? m.weight : null);
            weightChartInstance = new Chart(canvas, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: '体重 (kg)',
                        data: weightData,
                        borderColor: '#6d5ef0',
                        backgroundColor: 'rgba(109,94,240,0.12)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 3,
                        spanGaps: true,
                    }],
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            type: 'linear',
                            ticks: { precision: 1 },
                            title: { display: true, text: 'kg' },
                        },
                    },
                },
            });
        }

        function renderMetricHistory(metrics) {

                    <button class="btn btn-primary" onclick="saveMetric()">保存</button>

        async function saveMetric() {
            const numVal = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
            const data = {
                date: document.getElementById('mDate').value,
                weight: numVal(document.getElementById('mWeight').value),
                body_fat: numVal(document.getElementById('mBodyFat').value),
                waist: numVal(document.getElementById('mWaist').value),
                chest: numVal(document.getElementById('mChest').value),
                hip: numVal(document.getElementById('mHip').value),
                arm: numVal(document.getElementById('mArm').value),
                thigh: numVal(document.getElementById('mThigh').value),
            };
            if (!data.date) return alert('请选择日期');
            if (data.weight === null && data.body_fat === null && data.waist === null && data.chest === null && data.hip === null && data.arm === null && data.thigh === null) return alert('请至少输入一项数据');
            // 未填的字段（null）从 payload 中剔除：合并更新时不覆盖当天已有的其他指标
            const payload = Object.assign({}, data);
            Object.keys(payload).forEach(k => { if (payload[k] === null) delete payload[k]; });
            // 同一天已有记录则合并更新，避免重复
            const metrics = await api('/api/body-metrics');
            const existing = metrics.find(m => m.date === data.date);
            if (existing) {
                await api(`/api/body-metrics/${existing.id}`, { method: 'PUT', body: JSON.stringify(payload) });
            } else {
                await api('/api/body-metrics', { method: 'POST', body: JSON.stringify(payload) });
            }
            closeModal();
            renderMetricsChart();
            loadDashboard();
        }

        async function deleteMetric(id) {

                renderMetricsChart();
                loadDashboard();
            });
        }

        // ----- Goals -----
        async function renderGoals() {
            const goals = await api('/api/fitness-goals');
            const list = document.getElementById('goalList');
            if (goals.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="icon">🎯</div><p>还没有设置目标，来定一个吧！</p></div>';
                return;
            }
            list.innerHTML = goals.map(g => {
                const pct = g.start_value != null && g.target_value != null && g.target_value !== g.start_value
                    ? Math.min(100, Math.max(0, ((g.current_value - g.start_value) / (g.target_value - g.start_value)) * 100))
                    : g.current_value != null && g.target_value != null
                        ? Math.min(100, (g.current_value / g.target_value) * 100)
                        : 0;
                return `
                <div class="goal-card ${g.achieved ? 'achieved' : ''}">
                    <div class="goal-actions">
                        <button class="btn btn-sm btn-outline" onclick="openGoalModal(${g.id})">✏️</button>

                        <div class="goal-meta">

                            ${g.notes ? ` · ${esc(g.notes)}` : ''}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        async function exportBackup() {
            try {
                const data = await LocalDB.exportBackupData();
                const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const d = new Date();
                const fname = `指挥部备份_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
                a.href = url;
                a.download = fname;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showConfirm('💾 备份已生成！', '文件已保存。建议发到微信「文件传输助手」存起来。<br>以后换手机时点「恢复备份」选择这个文件即可。', '好的');

            if (!file) return;
            input.value = '';
            try {
                const text = await file.text();
                const data = JSON.parse(text);
                const ok = await confirmDialogAsync('📥 恢复备份', '恢复会<strong>覆盖</strong>手机里的当前数据，确定继续吗？', '确定恢复', '取消');

                await LocalDB.importBackupData(data);
                showConfirm('✅ 恢复成功！', '数据已恢复，正在刷新页面...', '好的');

        // ===== 习惯打卡 =====
        function todayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
