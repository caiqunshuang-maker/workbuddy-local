        async function renderHabits() {
            const habits = await api('/api/habits');
            const logs = await api('/api/habit-logs');
            const container = document.getElementById('habitsList');
            const summary = document.getElementById('habitsSummary');
            const today = todayStr();

            // 计算每个习惯的连续打卡天数
            function streak(habitId) {
                const dates = new Set(logs.filter(l => l.habit_id === habitId).map(l => l.date));
                let streak = 0;
                const d = new Date();
                // 今天没打卡则从昨天开始算（不打断 streak 展示）
                if (!dates.has(today)) d.setDate(d.getDate() - 1);
                while (dates.has(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)) {
                    streak++;
                    d.setDate(d.getDate() - 1);
                }
                return streak;
            }

            // 生成最近 14 天的打卡圆点
            function dots(habitId) {
                const dates = new Set(logs.filter(l => l.habit_id === habitId).map(l => l.date));
                let html = '';
                for (let i = 13; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                    const done = dates.has(ds);
                    html += `<span class="habit-dot ${done ? 'done' : ''}" title="${ds}"></span>`;
                }
                return html;
            }

            const doneToday = new Set(logs.filter(l => l.date === today).map(l => l.habit_id));
            const todayDoneCount = doneToday.size;

            if (habits.length === 0) {
                summary.textContent = '还没有习惯，点右上角＋新建吧！';
                container.innerHTML = `<div class="empty-state"><div class="icon">🔥</div><p>建立你的第一个好习惯，<br>每天打卡坚持！</p></div>`;
                return;
            }

            summary.textContent = `今天已打卡 ${todayDoneCount}/${habits.length} 项`;
            container.innerHTML = habits.map(h => {
                const isDone = doneToday.has(h.id);
                const st = streak(h.id);
                return `
                <div class="habit-card ${isDone ? 'done' : ''}" style="background:var(--surface);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px;display:flex;align-items:center;gap:12px;" onclick="openHabitDetail(${h.id})">
                    <button class="habit-check ${isDone ? 'checked' : ''}" onclick="event.stopPropagation();toggleHabit(${h.id})" style="width:36px;height:36px;border-radius:50%;border:2px solid ${isDone ? 'var(--green)' : 'var(--border)'};background:${isDone ? 'var(--green)' : 'transparent'};color:#fff;font-size:1.1rem;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;">${isDone ? '✓' : ''}</button>
                    <div style="flex:1;min-width:0;">
                        <div style="font-weight:600;font-size:0.95rem;">${esc(h.name)}</div>
                        <div style="display:flex;align-items:center;gap:4px;margin-top:6px;">${dots(h.id)}</div>
                    </div>
                    <div style="text-align:center;flex-shrink:0;">
                        <div style="font-size:1.2rem;font-weight:700;color:${st > 0 ? 'var(--orange)' : 'var(--text-muted)'};">${st}</div>
                        <div style="font-size:0.7rem;color:var(--text-muted);">天连击</div>
                    </div>
                    <button class="btn btn-outline btn-sm" style="flex-shrink:0;padding:4px 8px;" onclick="event.stopPropagation();deleteHabit(${h.id})">✕</button>
                </div>`;
            }).join('');
        }

        // ===== 习惯详情日历 =====
        let _habitDetailState = null; // { id, name, logs:Set, year, month }

        async function openHabitDetail(id) {
            const habits = await api('/api/habits');
            const habit = habits.find(h => h.id === id);
            if (!habit) return;
            const logs = await api('/api/habit-logs');
            const logDates = new Set(logs.filter(l => l.habit_id === id).map(l => l.date));

        function renderHabitDetail() {
            if (!_habitDetailState) return;
            const s = _habitDetailState;
            const overlay = document.getElementById('modalOverlay');
            const today = todayStr();
            const y = s.year, m = s.month;
            const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
            const dows = ['日','一','二','三','四','五','六'];
            const firstDay = new Date(y, m, 1).getDay(); // 0=Sun
            const daysInMonth = new Date(y, m + 1, 0).getDate();

            // 统计本月打卡
            let monthDone = 0;
            let monthTotal = 0; // 截至今天（或月末）的天数
            const todayDate = new Date();
            const isCurrentMonth = (y === todayDate.getFullYear() && m === todayDate.getMonth());
            const lastDay = isCurrentMonth ? todayDate.getDate() : daysInMonth;
            for (let d = 1; d <= lastDay; d++) {
                monthTotal++;
                const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                if (s.logDates.has(ds)) monthDone++;
            }

            // 计算总打卡天数和总连续天数
            const totalDays = s.logDates.size;
            // streak from today
            let st = 0;
            {
                const dd = new Date();
                if (!s.logDates.has(today)) dd.setDate(dd.getDate() - 1);
                while (s.logDates.has(`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`)) {
                    st++;
                    dd.setDate(dd.getDate() - 1);
                }
            }

            let gridHtml = '';
            // 空白格
            for (let i = 0; i < firstDay; i++) {
                gridHtml += `<div class="habit-cal-day empty"></div>`;
            }
            for (let d = 1; d <= daysInMonth; d++) {
                const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const done = s.logDates.has(ds);
                const isToday = (ds === today);
                const isFuture = new Date(y, m, d) > new Date(todayDate.getFullYear(), todayDate.getMonth(), todayDate.getDate());
                let cls = 'habit-cal-day';
                if (isFuture) cls += ' future';
                else if (done) cls += ' done';
                else cls += ' miss';
                if (isToday) cls += ' today';
                gridHtml += `<div class="${cls}" ${isFuture ? '' : `onclick="toggleHabitDate('${ds}')"`}>${d}</div>`;
            }

            const monthRate = monthTotal > 0 ? Math.round(monthDone / monthTotal * 100) : 0;

            overlay.innerHTML = `
            <div class="modal" style="width:360px;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
                    <h3 style="margin:0;">🔥 ${esc(s.name)}</h3>
                    <button class="btn btn-outline btn-sm" onclick="closeModal()">✕</button>
                </div>
                <div style="display:flex;gap:12px;margin-bottom:16px;text-align:center;">
                    <div style="flex:1;background:var(--surface-2,#f5f5f5);border-radius:8px;padding:8px;">
                        <div style="font-size:1.3rem;font-weight:700;color:var(--orange);">${st}</div>
                        <div style="font-size:0.7rem;color:var(--text-muted);">连续天数</div>
                    </div>
                    <div style="flex:1;background:var(--surface-2,#f5f5f5);border-radius:8px;padding:8px;">
                        <div style="font-size:1.3rem;font-weight:700;color:var(--green);">${totalDays}</div>
                        <div style="font-size:0.7rem;color:var(--text-muted);">累计打卡</div>
                    </div>
                    <div style="flex:1;background:var(--surface-2,#f5f5f5);border-radius:8px;padding:8px;">
                        <div style="font-size:1.3rem;font-weight:700;color:var(--primary);">${monthRate}%</div>
                        <div style="font-size:0.7rem;color:var(--text-muted);">本月完成</div>
                    </div>
                </div>
                <div class="habit-cal">
                    <div class="habit-cal-head">
                        <button class="btn btn-outline btn-sm" onclick="habitCalNav(-1)">‹</button>
                        <span style="font-weight:600;font-size:1rem;">${y}年 ${monthNames[m]}</span>
                        <button class="btn btn-outline btn-sm" onclick="habitCalNav(1)">›</button>
                    </div>
                    <div class="habit-cal-grid">
                        ${dows.map(d => `<div class="habit-cal-dow">${d}</div>`).join('')}
                        ${gridHtml}
                    </div>
                    <div class="habit-cal-legend">
                        <span><span class="dot" style="background:var(--green);"></span>已打卡</span>
                        <span><span class="dot" style="background:var(--surface-2,#f0f0f0);"></span>未打卡</span>
                        <span><span class="dot" style="background:transparent;border:2px solid var(--primary);"></span>今天</span>
                    </div>
                    <div style="margin-top:12px;text-align:center;font-size:0.75rem;color:var(--text-muted);">
                        ${isCurrentMonth ? `本月打卡 ${monthDone}/${monthTotal} 天` : `${y}年${monthNames[m]} 打卡 ${monthDone} 天`}
                    </div>
                </div>
            </div>`;
            overlay.classList.add('open');
        }

        function habitCalNav(delta) {
            if (!_habitDetailState) return;
            _habitDetailState.month += delta;
            if (_habitDetailState.month < 0) { _habitDetailState.month = 11; _habitDetailState.year--; }
            if (_habitDetailState.month > 11) { _habitDetailState.month = 0; _habitDetailState.year++; }
            renderHabitDetail();
        }

            renderHabits();
            loadDashboard();
        }

        // ===== 月度回顾 =====
        async function renderReview() {
            const sel = document.getElementById('reviewMonthPicker');
            const offset = sel ? parseInt(sel.value) : 0;
            const now = new Date();
            const year = now.getFullYear(), month = now.getMonth() + 1 + offset;
            const y2 = month <= 0 ? year - 1 : year;
            const m2 = month <= 0 ? month + 12 : month;
            const ms = `${y2}-${String(m2).padStart(2,'0')}`;
            const container = document.getElementById('reviewContent');

            const [tasks, txns, workouts, habits, logs, schedules] = await Promise.all([
                api('/api/tasks'),
                api(`/api/transactions?year=${y2}&month=${m2}`),
                api(`/api/workouts?year=${y2}&month=${m2}`),
                api('/api/habits'),
                api('/api/habit-logs'),
                api(`/api/schedules?year=${y2}&month=${m2}`),
            ]);

            // 待办完成率：普通任务按 due_date+completed；重复任务按该月展开日期 + task_logs 日志（done/skipped）
            const taskLogs = await api('/api/task-logs');
            const logsThisMonth = taskLogs.filter(l => l.date && l.date.startsWith(ms));
            const repeatIds = new Set(tasks.filter(t => t.repeat && t.repeat !== 'none').map(t => t.id));
            const doneLogSet = new Set(logsThisMonth.filter(l => repeatIds.has(l.task_id) && (l.status || 'done') === 'done').map(l => l.task_id + '|' + l.date));
            const skipLogSet = new Set(logsThisMonth.filter(l => repeatIds.has(l.task_id) && l.status === 'skipped').map(l => l.task_id + '|' + l.date));
            let totalTasks = 0, doneTasks = 0, skippedTasks = 0;
            tasks.forEach(t => {
                if (t.repeat && t.repeat !== 'none') {
                    const occ = repeatDatesInMonth(t, y2, m2);
                    occ.forEach(d => {
                        const key = t.id + '|' + d;
                        if (skipLogSet.has(key)) { skippedTasks++; return; } // 跳过不计入总数
                        totalTasks++;
                        if (doneLogSet.has(key)) doneTasks++;
                    });
                } else if (t.due_date && t.due_date.startsWith(ms)) {
                    if (t.skipped) { skippedTasks++; return; }
                    totalTasks++;
                    if (t.completed) doneTasks++;
                }
            });
            const doneRate = totalTasks > 0 ? Math.round(doneTasks / totalTasks * 100) : 0;

            // 收支
            const income = txns.filter(t => t.txn_type === 'income').reduce((s, t) => s + t.amount, 0);
            const expense = txns.filter(t => t.txn_type !== 'income').reduce((s, t) => s + t.amount, 0);
            const expByCat = {};
            txns.filter(t => t.txn_type !== 'income').forEach(t => {
                expByCat[t.category] = (expByCat[t.category] || 0) + t.amount;
            });

            // 训练
            const workoutCount = workouts.length;
            const workoutMinutes = workouts.reduce((s, w) => s + (w.duration || 0), 0);
            const workoutTypes = {};
            workouts.forEach(w => { workoutTypes[w.workout_type] = (workoutTypes[w.workout_type] || 0) + 1; });

            // 习惯
            const habitLogs = logs.filter(l => l.date && l.date.startsWith(ms));
            const habitDays = new Set(habitLogs.map(l => l.date)).size;

            // 日程
            const scheduleCount = schedules.length;

            // 支出分类 top3
            const topCats = Object.entries(expByCat).sort((a, b) => b[1] - a[1]).slice(0, 3);

            let html = `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;">
                <div class="review-card" style="background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center;">
                    <div style="font-size:0.8rem;color:var(--text-muted);">📋 待办完成率</div>
                    <div style="font-size:1.6rem;font-weight:700;margin-top:4px;color:${doneRate >= 60 ? 'var(--green)' : doneRate >= 30 ? 'var(--orange)' : 'var(--red)'};">${doneRate}%</div>
                    <div style="font-size:0.75rem;color:var(--text-muted);">${doneTasks}/${totalTasks} 完成${skippedTasks > 0 ? ` · ${skippedTasks}跳过` : ''}</div>
                </div>
                <div class="review-card" style="background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center;">
                    <div style="font-size:0.8rem;color:var(--text-muted);">💰 本月结余</div>
                    <div style="font-size:1.6rem;font-weight:700;margin-top:4px;color:${income - expense >= 0 ? 'var(--green)' : 'var(--red)'};">¥${(income - expense).toFixed(0)}</div>
                    <div style="font-size:0.75rem;color:var(--text-muted);">收 ¥${income.toFixed(0)} / 支 ¥${expense.toFixed(0)}</div>
                </div>
                <div class="review-card" style="background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center;">
                    <div style="font-size:0.8rem;color:var(--text-muted);">💪 本月训练</div>
                    <div style="font-size:1.6rem;font-weight:700;margin-top:4px;color:${workoutCount > 0 ? 'var(--green)' : 'var(--text-muted)'};">${workoutCount} 次</div>
                    <div style="font-size:0.75rem;color:var(--text-muted);">共 ${workoutMinutes} 分钟</div>
                </div>
                <div class="review-card" style="background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center;">
                    <div style="font-size:0.8rem;color:var(--text-muted);">🔥 习惯打卡</div>
                    <div style="font-size:1.6rem;font-weight:700;margin-top:4px;color:${habitDays > 0 ? 'var(--orange)' : 'var(--text-muted)'};">${habitDays} 天</div>
                    <div style="font-size:0.75rem;color:var(--text-muted);">${habits.length} 个习惯</div>
                </div>
            </div>`;

            // 支出分类占比条
            if (topCats.length > 0) {
                const max = topCats[0][1];
                html += `<div style="background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px;">
                    <h4 style="font-size:0.95rem;margin-bottom:12px;">🍔 支出 TOP3</h4>
                    ${topCats.map(([cat, amt]) => `
                        <div style="margin-bottom:10px;">
                            <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:4px;">
                                <span>${esc(cat)}</span><span>¥${amt.toFixed(0)}</span>
                            </div>
                            <div style="height:8px;background:var(--bg);border-radius:4px;overflow:hidden;">
                                <div style="height:100%;width:${Math.round(amt / max * 100)}%;background:var(--primary);border-radius:4px;"></div>
                            </div>
                        </div>`).join('')}
                </div>`;
            }

            // 训练类型分布
            const typeNames = { strength: '力量', cardio: '有氧', mixed: '混合', other: '其他' };
            const typeKeys = Object.keys(workoutTypes);
            if (typeKeys.length > 0) {
                html += `<div style="background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px;">
                    <h4 style="font-size:0.95rem;margin-bottom:12px;">💪 训练类型</h4>
                    <div style="display:flex;flex-wrap:wrap;gap:8px;">
                        ${typeKeys.map(k => `<span style="background:var(--bg);padding:6px 12px;border-radius:20px;font-size:0.8rem;">${typeNames[k] || k} ×${workoutTypes[k]}</span>`).join('')}
                    </div>
                </div>`;
            }

            html += `<div style="background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);">
                <h4 style="font-size:0.95rem;margin-bottom:10px;">📅 其他</h4>
                <div style="font-size:0.85rem;color:var(--text-muted);line-height:1.8;">本月共 ${scheduleCount} 条日程安排</div>
            </div>`;

            if (totalTasks === 0 && txns.length === 0 && workouts.length === 0 && habitDays === 0) {
                html = `<div class="empty-state"><div class="icon">📈</div><p>${ms} 暂无数据</p></div>`;
            }
            container.innerHTML = html;
        }


        function confirmDialog(message, onConfirm) {
            const overlay = document.getElementById('modalOverlay');
            overlay.innerHTML = `
            <div class="modal" style="width:340px;text-align:center;">
                <div style="font-size:2.2rem;margin-bottom:8px;">🤔</div>
                <p style="font-size:0.95rem;margin-bottom:20px;color:var(--text);">${esc(message)}</p>
                <div class="modal-actions" style="justify-content:center;">
                    <button class="btn btn-outline" onclick="closeModal()">取消</button>
                    <button class="btn btn-danger" id="confirmOkBtn">确定删除</button>
                </div>
            </div>`;
            overlay.classList.add('open');
            document.getElementById('confirmOkBtn').addEventListener('click', () => {
                closeModal();
                if (typeof onConfirm === 'function') onConfirm();
            });
        }

        function esc(s) {
            if (!s) return '';
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        // 重复待办在指定月份的展开日期（与 localdb.expandRepeatInMonth 逻辑一致）
        function repeatDatesInMonth(t, y, m) {
            const r = t.repeat;
            if (!r || r === 'none') return [];
            const startStr = t.repeat_start || t.due_date;
            const base = startStr ? new Date(startStr + 'T00:00:00') : new Date();
            const lastDay = new Date(y, m, 0).getDate();
            const out = [];
            if (y < base.getFullYear() || (y === base.getFullYear() && m < base.getMonth() + 1)) return out;
            if (r === 'custom' && t.repeat_days) {
                const days = new Set(String(t.repeat_days).split(',').map(x => parseInt(x)).filter(x => !isNaN(x)));
                for (let d = 1; d <= lastDay; d++) {
                    const dt = new Date(y, m - 1, d);
                    if (dt >= base && days.has(dt.getDay() === 0 ? 6 : dt.getDay() - 1)) out.push(dt);
                }
            } else if (r === 'weekly') {
                const dow = base.getDay();
                for (let d = 1; d <= lastDay; d++) {
                    const dt = new Date(y, m - 1, d);
                    if (dt >= base && dt.getDay() === dow) out.push(dt);
                }
            } else if (r === 'monthly') {
                const day = Math.min(base.getDate(), lastDay);
                out.push(new Date(y, m - 1, day));
            } else if (r === 'daily') {
                for (let d = 1; d <= lastDay; d++) {
                    const dt = new Date(y, m - 1, d);
                    if (dt >= base) out.push(dt);
                }
            } else if (r === 'weekdays') {
                for (let d = 1; d <= lastDay; d++) {
                    const dt = new Date(y, m - 1, d);
                    if (dt >= base && dt.getDay() >= 1 && dt.getDay() <= 5) out.push(dt);
                }
            }
            return out.map(dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`);
        }

        function formatDate(iso) {
            if (!iso) return '';
            // 兼容 "YYYY-MM-DD HH:MM:SS.mmm"（nowIso 格式，iOS Safari 不认空格分隔，需转成 ISO 格式再解析）
            const d = new Date(String(iso).replace(' ', 'T'));
            if (isNaN(d.getTime())) return String(iso);
            return d.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        // ===== 每日提醒（待办/纪念日/习惯） =====
        async function checkDailyReminders() {
            try {
                if (!('Notification' in window) || Notification.permission !== 'granted') return;
                const today = todayStr();
                const messages = [];

                // 今日待办
                const tasks = await api('/api/tasks?status=active');
                const todayTasks = tasks.filter(t => t.due_date === today);
                if (todayTasks.length > 0) {
                    messages.push(`📋 今天有 ${todayTasks.length} 件待办：${todayTasks.slice(0,2).map(t => t.title).join('、')}${todayTasks.length > 2 ? '...' : ''}`);
                }

                // 逾期待办
                const overdue = tasks.filter(t => t.due_date && t.due_date < today);
                if (overdue.length > 0) {
                    messages.push(`⚠️ 有 ${overdue.length} 件待办已逾期，记得处理`);
                }

                // 纪念日
                try {
                    const annivs = await api('/api/anniversaries');
                    if (Array.isArray(annivs) && annivs.length) {
                        annivs.forEach(a => {
                            const d = a.anniv_date || '';
                            const md = d.slice(5);
                            const todayMd = today.slice(5);
                            if (md === todayMd) {
                                messages.push(`🎉 今天是${a.name}${a.yearly ? '周年纪念日' : '纪念日'}！`);
                            }
                        });
                    }
                } catch (e) {}

                // 习惯未打卡
                try {
                    const habits = await api('/api/habits');
                    if (Array.isArray(habits) && habits.length) {
                        const logs = await api('/api/habit-logs');
                        const doneIds = new Set((Array.isArray(logs) ? logs : []).filter(l => l.date === today).map(l => l.habit_id));
                        const undone = habits.filter(h => !doneIds.has(h.id));
                        if (undone.length > 0) {
                            messages.push(`🔥 还有 ${undone.length} 个习惯没打卡：${undone.slice(0,2).map(h => h.name).join('、')}${undone.length > 2 ? '...' : ''}`);
                        }
                    }
                } catch (e) {}

                if (messages.length > 0) {
                    const n = new Notification('御前指挥部 · 今日提醒', {
                        body: messages.join('\n'),
                        icon: './icon-192.png',
                        tag: 'daily-reminder',
                    });
                    setTimeout(() => n.close(), 15000);
                }
            } catch (e) { /* 静默失败 */ }
        }

        // ===== Init =====
        // "跳舞"每周三待办自愈（幂等：每次启动都检查，不依赖任何标记）
        // 1. 先等 seed 导入完成，避免竞态导致 tasks 演示数据被跳过
        // 2. 有跳舞任务但缺 repeat_start → 只补起点，绝不删除用户可能新建的其他跳舞任务
        // 3. 完全没有 → 创建一条
        (async function initDanceTask() {
            try {
                if (window.LocalDB && LocalDB.seedIfNeeded) { try { await LocalDB.seedIfNeeded(); } catch (e) {} }
                const tasks = await api('/api/tasks');
                const dances = tasks.filter(t => t.title === '跳舞' && (t.repeat === 'weekly' || t.repeat === 'custom'));
                if (dances.length > 0) {
                    for (const d of dances) {
                        if (!d.repeat_start) {
                            await api(`/api/tasks/${d.id}`, { method: 'PUT', body: JSON.stringify({ repeat_start: '2026-01-07' }) });
                            console.log('[init] 跳舞任务已补起点 2026-01-07');
                        }
                    }
                    return;
                }
                await api('/api/tasks', {
                    method: 'POST',
                    body: JSON.stringify({
                        title: '跳舞',
                        due_date: '2026-01-07',
                        repeat_start: '2026-01-07',
                        repeat: 'weekly',
                        category: 'life',
                        priority: 'medium',
                        completed: 0
                    })
                });
                console.log('[init] 已创建跳舞每周三待办');
            } catch (e) { /* 静默失败，下次重试 */ }
        })();
        // 版本水印：确认手机加载的是哪一版（调试用）
        (function versionBadge() {
            try {
                const b = document.createElement('div');
                b.id = 'verBadge';
                b.textContent = 'v35';
                b.style.cssText = 'position:fixed;bottom:4px;right:6px;font-size:9px;color:#999;opacity:.7;z-index:9999;pointer-events:none;';
                document.body.appendChild(b);
            } catch (e) { /* ignore */ }
        })();

        // 启动：恢复上次所在页面（防止闪退/刷新后被强制拉回概览）
        (function bootPage() {
            let page = 'dashboard';
            try {
                const p = localStorage.getItem('wb_last_page');
                if (p && ALL_PAGES.includes(p)) page = p;
            } catch (e) { /* ignore */ }
            if (page === 'dashboard') loadDashboard();
            else {
                const btn = document.querySelector(`.nav-item[data-page="${page}"], .bn-item[data-page="${page}"]`);
                const title = btn ? (btn.dataset.title || btn.textContent.trim()) : '📊 概览';
                goToPage(page, title);
            }
        })();
        // 注册 Service Worker（离线可用）
        // 更新策略：静默更新。发现新版只预取缓存，绝不自动 reload，
        // 避免用户正在使用时被突然刷新打断（表现为"闪退回概览"）。
        // 下次自然打开页面时（导航 network-first）会自动加载最新版。
        try {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
                    reg.addEventListener('updatefound', () => {
                        const nw = reg.installing;
                        if (!nw) return;
                        nw.addEventListener('statechange', () => {
                            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('[sw] 新版本已就绪，下次打开自动生效');
                            }
                        });
                    });
                }).catch(() => {});
            }
        } catch (e) {}
        // 请求通知权限（用户首次打开时提示）
        try {
            if ('Notification' in window && Notification.permission === 'default') {
                // 延迟请求，避免打扰首次加载
                setTimeout(() => Notification.requestPermission(), 3000);
            }
        } catch (e) {}
        // 打开时检查今日提醒
        setTimeout(checkDailyReminders, 2500);
    </script>
